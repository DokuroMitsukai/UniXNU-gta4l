id = "power"
status = "planned"
components = []
paths = ["package/*Battery*", "package/*Battmgr*", "package/*Power*", "package/*PlatformPower*", "package/QcomQmp*", "package/QcomRpmh*", "package/QcomScm.h", "package/*Sdhci*", "scripts/*power*", "scripts/*battery*", "scripts/*pmgr*", "scripts/*firmware*", "scripts/*sdhci*", "scripts/analyze-gta4l-rpm-ldoa.py", "scripts/test-gta4l-rpm-ldoa-analysis.py"]
inputs = ["Original ApplePMGR consumer in the prelinked kernel; TB128FU original-PMGR bridge reference; gta4l PMIC, RPMh/RPM and clock resources are not yet inventoried."]
configuration = ["CONFIG_XNU_SHENG_PMGR=y; board.toml archives append build-platform-power.py; device series applies patches/xnu/sheng-platform-power.patch; package/ShengPlatformPower.cpp and scripts/build-platform-power.py are adapted with credit from TB128FU a9c3863."]
procedure = ["Run the bridge audit against the original kernelcache and prelinked kernel, then boot with sheng-pmgr=2 and no AMFI bypass for the first bounded test."]
findings = ["TB128FU's ShengPlatformPower bridge publishes the original ApplePMGRNub through an ABI-audited provider, reads and writes no hardware, and fails unsupported power operations explicitly.", "The audit passes against our original kernelcache f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7 and prelinked kernel. The PMGR-linked kernel sha256 is dc8184da757b5323d2f4fb6c7ac1d588790b3d44d583c6d6fd24897cdbbcfe60; bsd_init.o has XNU_SHENG_PMGR=1 and the kernel contains ShengPlatformPower and sheng_pmgr_run.", "QEMU TCG with sheng-pmgr=2 and no AMFI bypass reaches _bsd_init, _sheng_pmgr_run and _IOKitBSDInit with no AMFI 'No PMGR' panic and no _panic checkpoint; it stalls at _ml_get_timebase before _vfs_mountroot. Publication was not read back independently.", "The live FDT resolves /soc/sdhci@4744000 vdd-supply to phandle 0x1f7 (/soc/qcom,rpm-smd/rpm-regulator-ldoa24/regulator-l24, pm6125_l24) and vdd-io-supply to 0x1f0 (/soc/qcom,rpm-smd/rpm-regulator-ldoa11/regulator-l11, pm6125_l11). It reports L24 2,704,000-3,600,000 uV with init 2,704,000, L11 1,704,000-1,952,000 uV with init 1,704,000, SDHCI vdd level 2,960,000 uV, vdd-io level 1,800,000 uV, and qcom,vdd-io-always-on/lpm-sup booleans. No XNU RPM/RPMh/SPMI/regulator component exists; ShengPlatformPower is the Apple PMGR bridge, not a Qualcomm regulator driver. There is no supported XNU path to enable or set L24/L11, so the first host-local SDHCI probe keeps bus power and card clock off and reports the power stage blocked.", "The Mu-Silicium SDCC DXE ExitBootServices handler at SdccDxe.efi 0x81a8 configures the SDC1/SDC2 TLMM pads (0x00575000/0x00973000), sets SDHCI bus power, runs the v5 reset/power handshake (0x240/0x248/0x24c) and writes vendor registers; the reset clears the standard power and clock registers and the handler does not re-enable bus power, but has no PMIC/SPMI/LDO/RPM-request path. PmicDxeLa.efi 0x4220 locates the PMIC protocol GUID cea4489f-da0d-43d9-a3b2-766977a109f7 and calls the interface entry at 0x41ec, which issues SPMI writes at register bytes 0x14, 0x16 and 0xd1 only. Those addresses cannot reach the PM6125 LDO control registers 0x40/0x41/0x45/0x46/0x48/0x4c/0x61, so the two traced callees cannot directly write the L11/L24 enable or voltage registers. That is a direct-address exclusion, not proof that the callback leaves the rails unchanged: the 0x28 entry performs a read/modify/write of the arbiter IRQ clear register (v5 interpretation) over bitmap-selected APIDs (instruction sequence resolved; runtime bitmap unresolved), and for peripherals with the PMIC interrupt layout 0x14/0x16 are QPNPINT_REG_LATCHED_CLR and QPNPINT_REG_EN_CLR, so the writes clear latched interrupts and mask interrupt delivery. The 0xd1 value is u16>>14, so it can be 0-3, not necessarily zero. uefiplat.cfg has no LDO entries. During initialization the same IRQ status/clear routine runs via 0x266c -> 0x2d90, and 0x2d90 then calls 0x2ec8 with w3=0, which clears access-enable bit 0 for entries that pass its checks. The recovery path (0x27bc -> 0x3904) writes arbiter owner/APID registers at base+apid*4+0xa700 and base+apid*4+0x40900 when its conditions permit, though it is not proven to have run during the recorded boot. A null configuration pointer in the 0x120a8 exit callee reaches a non-returning self-loop, so the callback can hang instead of returning an error. See docs/firmware-handoff.md.", "qcom_spmi-regulator.c carries a PM6125 regulator table giving L11 peripheral 0x4a and L24 peripheral 0x57, with the common layout VOLTAGE_RANGE 0x40, VOLTAGE_SET 0x41, MODE 0x45 and ENABLE 0x46, so L11 enable is address 0x4a46 and L24 enable is 0x5746. The board DTS uses qcom,rpm-pm6125-regulators rather than qcom,pm6125-regulators, so the proven path is RPM-owned regulation, not AP-side SPMI access. Three limits keep this from being a ready probe: the vendor live.dts bounds the LDO USID to 0 or 1 but has no regulator subnode, so no pinned source chooses between them; voltage encoding is ops-dependent, with ldo/smps on the range/selector getter and ftsmps426/hfs430/hfsmps on the two-byte millivolt getter, and both getters return a software selector rather than microvolts; and pmic_arb_read_cmd issues the command with writel_relaxed into the observer window, where the 1000 us bound covers only the transaction poll, not the APID mapping walks. The audit in docs/pmic-audit.md blocks the probe: identity, the runtime callback state and the board-level electrical contract are all unresolved.", "docs/linux-regulator-lifecycle.md reconstructs the pinned board's power path with each statement tagged source-established, conditional or unknown. Only the board file has a regulators node; sdhc_1 has no vmmc-supply or vqmmc-supply; L11/L24 have DT min/max and regulator-allow-set-load but no regulator-boot-on, no regulator-always-on and no consumer, and their vdd_l9_l11/vdd_l23_l24 parent supply has no matching regulator, so regulator_resolve_supply may substitute the dummy regulator under full constraints, but registration does not depend on that substitution. Registration sets apply_uV and calls set_voltage, but rpm_reg_write_active includes uv only when the cached is_enabled is set, so no RPM packet is sent; always_on/boot_on are false, so registration does not enable either rail; the 30 s regulator_late_cleanup then reads the cached is_enabled of 0 and skips the disable. mmc_regulator_get_supply keeps -ENODEV error pointers, sdhci_msm_set_regulator_caps therefore writes no core_vendor_spec pad switch, sdhci_msm_set_pincfg calls pinctrl which returns 0 without applying a state, and the power IRQ acknowledges CORE_PWRCTL_BUS_SUCCESS after set_vmmc/set_vqmmc return 0. The probe does reset core_vendor_spec to 0xa9c and later paths rewrite other bits of it. Linux attempts RPM votes for VDDCX corners and interconnect bandwidth through rpmpd, OPP and icc-rpm, but none for L11/L24; a failed OPP call at probe is only warned about. The AP therefore never learns the rail state.", "Host-only dependency tracing corrects the sdhc_1 prerequisite record: the probe requests VDDCX SVS_PLUS and the genpd attach enters the rpmpd send path, but genpd aggregates across attached devices and subdomains and the provider caches that aggregate, which may be higher than SVS_PLUS, and a pre-sync aggregate may emit max_state and physical voltage is unmeasured; PIO does not use the SDHC DMA master; SMMU stream 0xc0 state is unknown; the TLMM SDC2 write target is 0x00973000; and the L11/L24 handoff state remains unmeasured. Pinned-revision MMC/SDHCI/genpd/ICC sources establish the power-request chain through sdhci_set_power_noreg, genpd power-on at attach, and that both SDHC interconnect paths attempt RPM master/slave and bus-clock votes (the cpu-sdhc path is not local-only). PIO uses CPU MMIO rather than the SDHC DMA master. Physical rail/CX voltage and SMMU state remain unmeasured. The power stage stays blocked.", "Step 4 records the candidate-specific electrical-contract assessment in docs/sdhc-electrical-contract.md. For sdhc-bus-power-activation every safety-critical area is blocking: supply voltage/absmax, IO compatibility, current/loading, transients, sequencing, back-powering, retention, fault handling and recovery. The document also records the evidence-acquisition requirements and proposed measurement requirements without executing them; PMIC readback is explicitly not a substitute for physical voltage or power-good evidence.", "Step 5 verifies only the existing controller-local probe: 33 deterministic scenarios pass, ten negative-control mutations are rejected by the simulator, and the separate-implementation oracle (same author) validates all 33 traces, rejects the same ten mutations plus forty-one synthetic trace controls, and accepts the valid initially-zero interrupt baseline. The oracle derives its policy from the header and write contract, not the harness allowlists. The policy still prohibits bus-power enable, card-clock enable, power-status acknowledgement and PMIC/RPM/SPMI activity.", "Step 6 records the dated NO-GO decision in docs/sdhc-decision-memo.md. The gate table fails electrical contract, starting state, access policy, software behavior for the bus-power-only candidate, independent assessment, recovery and authorization. Blockers use canonical E1-E9 (electrical-contract areas) and S1-S4 (software, provenance, independent assessment, authorization) identifiers. No approval request is made because the technical prerequisites are not met.", "The stock-firmware analysis archive supplied by https://github.com/NoNameBuilder was audited in docs/stock-firmware-analysis-audit.md. All 214 manifest-listed files match their hashes, but the supplied XBL executable bytes and device-tree overlays differ from the captured image and live FDT, so its code-level conclusions do not transfer automatically. Its XBL program-header layout prompted correction of our missing 0x5fc00000 LOAD range; its LCDB voltage, PMIC interrupt-specifier, XBL address and disassembly-coverage claims were corrected. It adds no rail, pad or power measurement and closes no gate.", "A bounded, reproducible host-only scan of the captured rpm.img (scripts/analyze-gta4l-rpm-ldoa.py; image sha256 272bebd3ddd7ef223d6e95e9b4cd30385a3df0eb4fa7beae6b622f457b4937c6) finds exactly one stored pointer to the L11 name record (0x46966a8, the dead selector slot), none to L24, one to the selector array (from the unreferenced group table at 0x46966fc), one to the voltage table (the descriptor at 0x4696c40), one to the descriptor (0x4697f10 inside the 0x4697e20 boundary table), and none to 0x4697f10 or the group table. The class table at 0x4695774 is zero in the linked image and the setter's class object is built at runtime by 0x46996c4, so the runtime count and id bounds are conditional. This is a stored-word scan, not a control-flow reachability result."]
completion = ["Declared power controls and battery readings match observations; each claimed sleep/resume transition restores its dependent peripherals."]
limits = ["No power backend (clocks, sleep, reset) is implemented. The bridge is runtime-unqualified and the QEMU stall is unresolved. The RAM-root fixture booted through the PMGR-linked kernel without AMFI bypass arguments; PMGR publication and power operations remain unqualified.", "The firmware trace shows the Mu-Silicium PMIC exit path reaches only the SPMI write and the 0x28 entry and writes register bytes 0x14, 0x16 and 0xd1, which cannot directly reach the LDO control registers 0x40/0x41/0x45/0x46/0x48/0x4c/0x61; it does not measure the rails, does not resolve the runtime 0x28 bitmap or the clear-register read-back, and can clear latched PMIC interrupts and mask interrupt delivery on peripherals using the QPNPINT layout. The SPMI map reports commanded state only, supplies no power-good bit, leaves the LDO USID unresolved, and depends on a subtype read for voltage decoding. An SPMI read is a transport bring-up: it needs arbiter version detection, an APID owner-table parse and one observer command write per transaction, and the 1000 us bound covers only the transaction poll. The board-level electrical contract, including absolute maximums, consumer topology and safe sequencing, is not established, so docs/pmic-audit.md blocks live PMIC access. The LDOA reference analysis is a stored-word scan: it does not exclude computed addresses, runtime relocation or aliasing, and the class object is runtime-built."]
next_action = ["Capture a separate PMGR publication/power result on the tablet; do not claim power support from the bridge or from the RAM-root fixture. Keep bus power and the SDHCI card clock off until the retained-rail electrical contract and a direct rail measurement are established; a new RPM/SPMI/regulator path is not required merely to match the pinned design. See docs/sdhci-host-init.md. The Mu-Silicium exit trace is recorded in docs/firmware-handoff.md and does not unblock the power stage. Live PMIC/SPMI access is blocked by docs/pmic-audit.md: the L11/L24 slave assignment is unresolved between USID 0 and 1 (bounded to that pair and not selected by any pinned source in docs/pm6125-usid-research.md), the runtime 0x28 bitmap, the clear-register read-back value and the indirect callback paths remain unresolved, the voltage getters return software selectors rather than microvolts, and the board-level electrical contract is absent. Do not scan candidate slaves or substitute a USID. The next legitimate step is host-side: try to reconstruct the working RPM-owned Linux path and its assumptions from pinned sources rather than inventing AP-side SPMI access. That reconstruction is recorded in docs/linux-regulator-lifecycle.md and shows the AP never enables, disables or reads L11/L24. Remaining host-side questions are what the RPM firmware does across suspend and shutdown, whether the handoff rail state is guaranteed or incidental, which other consumers share the two supplies, and what the board-level electrical contract requires. docs/power-path-decision.md inventories that contract gap and selects the retained-rail RPM-owned path over AP-side SPMI; it does not authorize a live test. docs/sdhc-dependency-trace.md records the corrected remaining prerequisites and lists the fetched pinned-revision sources with hashes; passing the controller-local gate does not establish power, card-command, DMA or tuning readiness. Step 4 records the candidate-specific contract assessment in docs/sdhc-electrical-contract.md and Step 6 records NO-GO in docs/sdhc-decision-memo.md. The passing host-local scenarios, mutations and oracle are software evidence only; they do not authorize bus-power or card-clock activation. The next legitimate work is host-only evidence acquisition and, separately, an owner-approved measurement-only procedure that does not activate SDHC; approval of that measurement does not approve a controlled activation or the bus-power capability (docs/sdhc-decision-memo.md §6.2-§6.4). The current-tree evidence baseline is in docs/evidence-baseline.md. The stock-firmware analysis supplied by https://github.com/NoNameBuilder and its audit are recorded in docs/stock-firmware-analysis-audit.md; they are cross-check material and do not authorize live access."]
evidence = [{ kind = "source", reference = "docs/rpm-power-interface.md", result = "Records the RPM-owned regulator path, why the AP never enables, disables or reads L11/L24, the bounded captured-image trace of the RPM LDOA resource tables, and the runtime registration of the LDOA parser and aggregator that keep a latched per-id state (the separately traced 0x46166c8/0x46168dc pair is the smpa class)." }, { kind = "source", reference = "docs/power-retention-evidence.md", result = "Records the transition-by-transition retention gaps and the bounded RPM/XBL static trace: LDOA tables for both rails, no traced L11/L24 voltage/mode/enable write, and no retention result." }, { kind = "source", reference = "docs/stock-firmware-analysis-audit.md", result = "Audits the stock-firmware analysis supplied by https://github.com/NoNameBuilder: 214/214 manifest hashes match, but the supplied XBL executable bytes and DT overlays differ from the captured image and live FDT; records the useful XBL layout lead, the corrected LCDB voltage/IRQ/XBL-address/disassembly-coverage claims, the RPM listing build mismatch and the absence of any rail or power measurement. Section 7 compares an exact-build SM-T505N package with the capture: four BL images and both AP images match in full, six BL images match on their decompressed prefixes with unexplained nonzero trailing bytes, the TWRP recovery differs as expected, and the vbmeta mismatch remains unresolved; the archive and region code stay outside the repository." }, { kind = "source", reference = "docs/pmic-audit.md", result = "Records the PMIC/SPMI audit corrections and the live-access blockers." }, { kind = "source", reference = "docs/pm6125-identity-evidence.md", result = "Inventories the pinned PM6125 identity, rail numbering and vendor consumer assignment; the USID and electrical contract remain unresolved." }, { kind = "source", reference = "docs/spmi-0x28-analysis.md", result = "Records the instruction-level SPMIDxe +0x28 trace, the access-type direct-address exclusion, the initialization access-enable clear, the recovery arbiter owner/APID writes, the non-returning exit-callback configuration path, and the bounded descriptor-base scan (one read, no write intersecting [0x8878,0x8880); 64-bit register/effective-address wrapping, paired access/writeback and boundary-crossing handling, pointer-slot invalidation, independent conditional-branch paths and a strict unsupported-instruction stop; internal indirect/computed and runtime/external writers unresolved)." }, { kind = "source", reference = "scripts/test-gta4l-spmidxe-descriptor-base.py", result = "Host-only, hash-pinned static check of the SPMIDxe descriptor-base override: verifies the 0x38b0 read/override words, the 0x38c8 caller and .data layout, follows initial .data pointers, pre/post-index addressing and bounded direct BL recursion, distinguishes XZR from SP, does not seed XZR roots, keeps conditional-branch paths independent, propagates their invalidation at function return, invalidates .data pointer slots overwritten in the path or by modeled calls, stops at instructions outside its register-only whitelist, detects writes intersecting the 8-byte override, resolves the known caller stores at 0x38bc/0x38f4, reports unresolved non-stack loads and stores and every scan truncation, and includes pointer-chain, overlap, partial-store, call-clobber, 64-bit ADD/SUB and effective-address wrapping, paired access/writeback, address-space-boundary, XZR/SP, XZR-root, ADR-XZR, branch-separation, revisit, stale-pointer, cross-call, truncation and decoder controls; all six result sets are unchanged from the audited 4c447b9 baseline; it does not execute firmware." }, { kind = "source", reference = "docs/pm6125-register-map.md", result = "Records the L11/L24 SPMI base addresses, common offsets and voltage-decoding caveats." }, { kind = "source", reference = "docs/firmware-handoff.md", result = "Records the Mu-Silicium exit trace and the booted-image provenance for the three drivers." }, { kind = "source", reference = "docs/evidence-baseline.md", result = "Records the current-tree revision, dirty/untracked inventory, relevant file hashes, pinned-source cache provenance and the distinction between the current tree, the local firmware volume and the previously booted image." }, { kind = "source", reference = "docs/sdhci-host-init.md", result = "Records the host-init probe result and the retained-rail contract limits." }, { kind = "source", reference = "docs/vendor-sdhc-power-sequence.md", result = "Pins the vendor LineageOS kernel and board overlay and traces the stock BUS_ON path: controller clock, BUS_ON, L24, L11, pads, IO high, then a BUS_SUCCESS or BUS_FAIL acknowledgement; the core can time out after 5,000 ms and continues, and the card clock is programmed after the 10 ms core power delay and after check_power_status returns. RPM votes are aggregated by rpm-smd-regulator.c across consumers and active/sleep sets; the AP sees only cached per-consumer requests. Official Samsung CXG1/CWI2 source (kernel 4.19.157; relevant files byte-identical) confirms the power/regulator logic but omits the LineageOS card-detect early-fail/cleanup blocks; the exact CXB1 source is unavailable and the archive contains no vendor DTS. The captured DT declares no regulator enable-time/ramp delay, but framework, RPM acknowledgement and firmware sequencing delays remain unmeasured. Software order only; no electrical order, limit or measurement." }, { kind = "source", reference = "scripts/extract-gta4l-firmware.py", result = "Host-only extractor and --validate gate used for the booted-image provenance. The gate now rejects a declared kernel overrun, an invalid appended DTB header/size/bounds, a malformed trailing outer FFS entry, and non-erased trailing FV bytes, and it validates the whole outer stream before accepting the inner FV." }, { kind = "source", reference = "scripts/test-extract-gta4l-firmware.py", result = "Self-test for the extractor gate: pins the committed 90-module inventory, checks the three driver hashes, and rejects kernel overruns, invalid DTBs, malformed trailing outer FFS entries, non-erased tails, malformed sections and corrupt gzip end to end." }, { kind = "source", reference = "docs/power-path-decision.md", result = "Inventories the missing board-level electrical contract and recommends the retained-rail RPM-owned path over AP-side SPMI, without authorizing a live test." }, { kind = "source", reference = "docs/pm6125-usid-research.md", result = "Bounds the L11/L24 SPMI USID to {0,1} from pinned DT evidence and records that no pinned source selects one, so the RPM path is not exercised by the USID question." }, { kind = "source", reference = "docs/power-retention-evidence.md", result = "Records transition-by-transition RPM retention evidence: no AP vote for L11/L24, VDDCX/interconnect votes differ, the UEFI exit path is not passive, and retention across handoff, suspend, shutdown and reboot remains unestablished." }, { kind = "source", reference = "docs/sdhc-dependency-trace.md", result = "Records the sdhc_1 dependencies beyond L11/L24 (VDDCX corner, interconnect, GCC branches/reset, TLMM pads, SMMU stream 0xc0, IRQs) and which are present at handoff versus absent in XNU." }, { kind = "source", reference = "docs/sdhc-electrical-contract.md", result = "Records the Step 4 board-level electrical-contract assessment for the bus-power-only candidate: nine blocking safety-critical areas (E1–E9) and the evidence-acquisition requirements." }, { kind = "source", reference = "scripts/oracle-gta4l-sdhci-host-init.py", result = "Separate-implementation host oracle (same author) for the controller-local access policy; derives read/write rules from the header and write contract, validates 33 traces, checks prerequisite values, interrupt-suppression confirmation on both initial-value paths, universal stage-local poll bounds, reset-clear ordering, the reset-to-clock observation window, the stable clock poll completion and immediate final confirmation before downstream accesses, the eleven required final stage-4 observations, and post-reset state, rejects ten source mutations plus forty-one synthetic trace controls, and accepts the valid initially-zero interrupt baseline." }, { kind = "source", reference = "docs/sdhc-decision-memo.md", result = "Records the dated Step 6 NO-GO decision, the E1-E9/S1-S4 blocker dispositions and the separated baseline-measurement, controlled-activation and capability-approval gates for sdhc-bus-power-activation." }, { kind = "source", reference = "scripts/analyze-gta4l-rpm-ldoa.py", result = "Host-only, hash-pinned analysis of the captured RPM LDOA tables: ELF/LOAD/PT_NULL layout checks, full selector/group/voltage/descriptor/boundary validation, Thumb-aware stored-pointer counts for L11/L24, PT_LOAD-only scanning, the linked-zero class table, and optional --code checks for the documented Thumb callback literals, class registration and direct call sites." }, { kind = "source", reference = "scripts/test-gta4l-rpm-ldoa-analysis.py", result = "Synthetic-image self-test for the RPM LDOA analyzer: anchors, Thumb reference counts, PT_NULL exclusion, code attribution, wrong hash/mapping, changed selector/voltage/boundary, altered callback/class/call-edge controls and deterministic output without private firmware." }, { kind = "source", reference = "docs/sdhc-evidence-gap-checklist.md", result = "Links every canonical E1-E9/S1-S4 gate to established evidence, missing input, acquisition route, proposed role, closure criterion, informational cross-dependencies and unresolved contradictions; revision 2 adds staged-approval separation, claim-level references and the Phase 2 acquisition register; revision 3 adds shared-consumer and parent-supply tracking plus separate USID, runtime-APID and descriptor-base items with gate mappings; revision 4 aligns the descriptor-base item with the 0x8878 override path and extends measurement tracking to E5-E7; revision 5 records the pinned-image descriptor-base scan; revision 6 corrects its scope after an audit, adds pointer-chain, overlap and pre/post-index controls, and leaves internal indirect/computed and runtime/external writers open; revision 7 strengthens the scan with XZR/SP separation, pointer-slot invalidation, a strict unsupported-instruction stop, and unresolved load/store, revisited-state and truncation reporting; revision 8 keeps conditional-branch paths independent, propagates their invalidation at function return, and stops seeding XZR roots; revision 9 records the exact-build package comparison and the vendor BUS_ON trace; revision 10 narrows those claims after the broad host-only audit (four full and six prefix BL matches, the rpm-smd-regulator backend and path caveats, and 64-bit scanner wrapping with unchanged result sets); revision 11 records the official Samsung CXG1/CWI2 source comparison and the card-detect difference, the non-applicability of the inspected SM-T505 family pages, and the KMDX60018M-B425 candidate with its unresolved datasheet; no gate is closed and NO-GO remains." }]

[[area]]
id = "packaging"
status = "planned"
components = []
paths = ["scripts/*payload*", "scripts/*image*", "scripts/*flash*", "scripts/package-*", "scripts/package.sh", "scripts/prepare-gta4l-boot-dtb.py", "scripts/*boot-image*", "scripts/*adt*", "scripts/pin-gta4l-xnu-mtimes.py", "scripts/test-gta4l-xnu-mtimes.py", "patches/**", "package/Kit.toml", "docs/upstream-packaging.md", "docs/boot-dtb-provenance.md", "docs/resolved-inputs.md", "scripts/test-gta4l-packaging.py", "scripts/test-gta4l-inventory.py", "scripts/test-gta4l-workflow.py", "scripts/audit-gta4l-resolved-inputs.py", ".github/workflows/package-gta4l.yml"]
inputs = ["Format 2 kernel step, archive builders, prelink, payload and boot image; 192 MiB packed payload; iPad7,1 17.7.11 21H461 kernelcache.", "UniXNU release tooling at 6790e7ce6e77f67a9174fba1255e64eacf1c41ad with 2ced2d7; canonical templates/package.sh; Mu-Silicium gta4l.dtb as the boot tree source.", "Captured SM-T505N BOOT partition: 100,663,296 bytes, the size of both partition snapshots and every audit/diagnostic image."]
configuration = ["board.toml payload size_mib=192, loader=firmware, panic_screen=true, dram_size=0xC0000000; CONFIG_XNU_BUILD_ARCHIVES=y; output out/gta4l/ipados-17.7.11-21H461/gta4l.", "board.toml [package] unixnu=../UniXNU and boot_partition_bytes=100663296; [package.defconfig][\"ipados-17.7.11-21H461\"]=gta4l_defconfig; [bootimg] dtb=build/gta4l/boot.dtb; firmware preflight scripts/check-gta4l.py and scripts/prepare-gta4l-boot-dtb.py."]
procedure = ["./unixnu build kernel -D ../UniXNU-gta4l; ./unixnu build package; ./unixnu build firmware; ./unixnu build payload; ./unixnu bootimg.", "Canonical flow: scripts/package.sh --os ipados-17.7.11-21H461 (or --os 17) [--no-deps] [--check] runs unixnu release deps, preflight, patches, build, pack and verify. The firmware preflight stages the Mu-Silicium boot DTB through UNIXNU_UEFI.", "For a raw RAM-root diagnostic payload, use scripts/build-gta4l-diagnostic-payload.py --diagnostic host-init with the data ramdisk, owner trust cache and unique chip ID. It copies the device tree, sets payload size and packed_data_ramdisk=false, runs the payload step and checks the ADT contract without modifying the tracked board.toml.", "For a diagnostic image, use scripts/package-gta4l-diagnostic.py with the pinned v5 baseline and the payload; it preserves the header, firmware, boot DTB and boot kernel section, recomputes the boot-image ID, requires the payload/ADT contract, and runs scripts/check-gta4l-boot-image.py. Run scripts/test-gta4l-boot-image.py, scripts/test-gta4l-diagnostic-package.py and scripts/test-gta4l-sdhci-host-init-sim.py before flashing.", "To replay the historical payload, run scripts/build-gta4l-diagnostic-payload.py with the audit board snapshot and --kernel; set SOURCE_DATE_EPOCH=1793180892 for the historical FAT timestamp, and use scripts/normalize-gta4l-adt-seed.py for the fail-closed seed comparison into a new output path; it refuses an existing output and candidate/reference aliases. docs/payload-build-recipe.md records the inputs, the clean hash, the seed-normalized comparison and the preserved out/gta4l/payload-testbuild-evidence directory."]
findings = ["The PMGR-linked kernel/prelink pass: kernel.macho is a 49 MiB Mach-O arm64 image with SHA-256 dc8184da757b5323d2f4fb6c7ac1d588790b3d44d583c6d6fd24897cdbbcfe60; link.filelist has 1006 entries and none are missing. The earlier no-bridge hash was ef85af5417ace24e7b96f6c5a3224d2e7c40a163c1532bf2586f23fb5dd5f8bd.", "The full ordered archive plan is required: replacing it with only build-platform-power.py dropped the NativeAES bindings and failed the final link. board.toml now keeps the architecture list and appends the PMGR builder.", "The fresh tree first stopped in prepare-xnu-source.py while fetching omitted DriverKit headers; the retry-safe fetch restored 26 headers. The earlier Format 1 corecrypto failure was stale state, not a missing bootstrap object set.", "The corrected v2 audit image preserved the v5 boot header, firmware, boot DTB and boot kernel section exactly but was produced by temporary board.toml substitution. scripts/build-gta4l-diagnostic-payload.py now replaces that path for raw payloads by copying the device tree and forcing the explicit size and packed-data flags; scripts/package-gta4l-diagnostic.py takes the pinned baseline and a named payload as explicit inputs.", "scripts/package-gta4l-diagnostic.py now packages from the pinned v5 baseline and a named payload without modifying board.toml. It preserves the header page, firmware, boot kernel section and boot DTB, replaces only the ramdisk, recomputes the Android boot-image SHA-1 ID, and runs the component gate. Reproducing v2 from the v5 baseline and audit payload is byte-identical: a34519c66820eb5f1f4c4790be5e10233ffd4c8a4ece2df4768e7dca151c8546.", "scripts/check-gta4l-boot-image.py now checks the header page excluding the deterministic ID, the recomputed ID, zero kernel padding, absence of trailing data, the appended FDT total size, the Qualcomm ID properties and an optional expected payload hash. scripts/test-gta4l-boot-image.py covers exact pass, payload-only replacement, minimal-DTB substitution, a different valid DTB, a changed header field, a wrong ID, nonzero padding, trailing data, a short ramdisk, a wrong expected payload and a malformed image.", "An independent ABL/LinuxLoader-oriented check with bootimg_tool.py, provided by https://github.com/NoNameBuilder, confirmed the v2 header, appended FDT and Qualcomm ID properties and rejected the v1 DTB. The tool is recorded as external evidence, not vendored; its outer FV/LZMA checks also fail on the known-good v5 image and are not used as a gate.", "scripts/check-gta4l-payload.py now checks the ADT memory-map placeholder against the actual scratch-data.img layout and checks unixnu.toml diagnostic arguments. Its self-test rejects the failed packed/raw mismatch and passes corrected v2. The failed host-init payload was packaged as PackedRAMDisk while the raw N4KROOT fixture reports RamdiskPacked=FALSE; DarwinBoot returned EFI_COMPROMISED_DATA at the UniXNU picker. Corrected v2 reserves RAMDisk and passes both the payload checker and the 18-check boot-image gate.", "scripts/build-gta4l-diagnostic-payload.py makes the former temporary diagnostic board explicit and reproducible: it copies the device tree, forces payload.size_mib=80 and packed_data_ramdisk=false, runs the normal payload step, copies the result, and requires the payload contract before writing a manifest. The tracked board.toml remains at 192 MiB packed.", "scripts/package-gta4l-diagnostic.py now runs scripts/check-gta4l-payload.py before publishing and records the contract result in the manifest. scripts/test-gta4l-diagnostic-package.py rejects a wrong expected diagnostic and the retained packed/raw failed payload; the valid audit payload still reproduces the v2 image byte-for-byte.", "scripts/test-gta4l-sdhci-host-init-sim.py compiles the production host-init source against a fake MMIO window and minimal kernel-header stubs, replaces only the six MMIO helpers with logging hooks, and records every read and write. It exercises conflicting arguments, an absent boot argument, a failed mapping, bus power already on, reset timeout, unstable clock, a pending vendor power request and a device-side vendor change; it asserts the exact write sequence, rejects any access outside the allowlist, and rejects an injected same-value POWER_CONTROL write that leaves final memory unchanged.", "The historical-host payload replay reproduces every payload byte except the 64-byte ADT random-seed: the clean payload 1d15ea68cd570382ed4ba7b426aa4fb29cf5c303124a289af16451248a8975ff differs from the historical 31b78bec7529706407f682e64dbc9c4c990e86009025174fd3f791606b29ea31 only at 0x30e3b78, and the fail-closed seed-normalized payload is byte-identical. Packaging the normalized payload against the v5 baseline reproduces the historical audit v2 image a34519c66820eb5f1f4c4790be5e10233ffd4c8a4ece2df4768e7dca151c8546 byte-for-byte; the clean payload packages to 037ba650847caa0cb32ac14a99c13736ae2ae6196700344531a224590c6694eb, differing in the derived image ID and the seed. docs/payload-build-recipe.md records the pinned inputs. A second controlled clean build (payload c697903b74279b6cadf364b94871a6125b42229cbdedf250bfcb62331b8d3d4c, boot 60ad9d056b439a2c53f82dddcefc6ac9ec0df0a5b323ff9cdcebc3d76e15e8f8) passed both gates and normalization again reproduced 31b78bec... and a34519c6... byte-for-byte. A clean bit-exact build needs a supported ADT seed pin, which the pinned UniXNU does not provide. The controlled build is preserved at out/gta4l/payload-testbuild-evidence with provenance.json and a verified SHA256SUMS.", "The linked kernel 3103e067575d94d878485de464ee0173b07ab2f02215d3abae6fb962c1c59064 is reproduced byte-for-byte from the pinned source and patches with the historical build date, personality, object and archive-member mtimes and RC_ProjectSourceVersion=10063.141.1; the prelink outputs 452026b2d8bbfaaa5b6ebc97ce235f396a8929b50d3957eff4c655eddd30ca86 and 9f70ad6594f539f447029d5714c0cd065b14b3c5e84b54dfd7c8d5b5c22572e8 are regenerated from it (docs/kernel-build-recipe.md sections 6-7).", "patches/xnu/gta4l-emmc-probe.patch adds the opt-in gta4l-emmc-probe preflight/run hooks to bsd_init; the probe archive is linked through build-gta4l-emmc-probe.py and stays disabled unless the boot argument is set.", "Upstream release tooling 6790e7ce6e77f67a9174fba1255e64eacf1c41ad plus 2ced2d7 is adopted with scripts/package.sh byte-identical to templates/package.sh (sha256 f7b8e3ea043058b9c61d5b45c32b8e7669a85737c89d55d404957c3b43ec4aab) and pipeline.py byte-identical to upstream (sha256 88a3c93a2e71fc2f3e5c296e5ba5661defc4833ab2a337b6eff3de97e14f5233).", "The board reads [package] unixnu=../UniXNU, boot_partition_bytes=100663296 from the captured BOOT partitions, and the full iPadOS 17 profile name in [package.defconfig]. The only installed OS profile is ipados-17.7.11-21H461; --os 26, --os 27, an absent profile name and a non-arm64 profile are rejected before a build.", "The standard release with the tracked 192 MiB packed payload produces a 203,132,928-byte boot image. verify refuses it against the 100,663,296-byte BOOT partition, so the release artifact is not the safe diagnostic image and is not a flash candidate.", "Boot DTB provenance is resolved: the evidence DTB dc4c719d06e408654680524af26052d609baa14dd57da9082fd9f35c6509de9e is reproduced byte-exactly from the first FDT in Mu-Silicium Resources/DTBs/gta4l.dtb (totalsize 316,095, sha256 5c4c0599ff430bec71de6bb75663eb857c30ae368823d55054fd9a90e8eb77f8) plus the board dtb_node edits and initrd marks. The PixelExperience Android 11 release boot DTB plus dtbo.img entry 0 merge (823,717 bytes, 47ba96e5692b4006d28b6a39ef701df1e6b76f7a333eada1b686e186063ee97f) does not match. The firmware preflight now stages the truncated source at build/gta4l/boot.dtb.", "scripts/unixnu/kernel.py passes UNIXNU_DEVICE to the archive builders, matching the reviewed upstream release tooling. The RAM-root fixture recipe pin for kernel.py is refreshed to 2f07043b319767db67a8bd67a0515f5620fb036aa9453a160a3de1829d38ab4c; docs/ram-root-fixture-reproducibility.md keeps the historical b9b6e572f3ff9d7f62d7c10db9913b8993287ea41dbbb50011d13ee17f0f3271, notes that the fixture builder imports only linux_env and never calls build_archives, and is checked again by its recipe test. The manual package workflow now runs the workflow, packaging, boot-image and diagnostic-payload contract tests before the dependency step and has no upload step: image publication is disabled while the BOOT-size artifact scope is unresolved."]
completion = ["Kernel and prelink succeed, payload contains all declared inputs, and the boot image matches the bootloader format and size limit.", "scripts/package.sh is a verbatim template copy, the board package fields resolve, the profile target is fixed, and host fixtures cover the manifest, the 1000-byte command line, the BOOT size limit and unsupported-profile rejection."]
limits = ["The PMGR kernel host build/prelink and one QEMU checkpoint run pass. Payload and boot images have been built from this kernel, and the RAM-root report fixture booted on the tablet; it is not an authenticated-root result.", "The payload replay starts from the historical prelinked kernel; the kernel compile/link is replayed separately in docs/kernel-build-recipe.md, and a clean bit-exact payload build remains not established.", "The release flow has not been run end-to-end on this working tree and no release image, Actions run or device result exists. The default 192 MiB payload cannot fit BOOT, so a complete release verify is expected to fail at the partition limit; use the diagnostic flow for on-device images.", "The manual package workflow is static-validated only. It has not run on a runner and is not a published artifact contract; its UniXNU pin is published on the fork, but the workflow file is not on the device default branch, so it cannot be dispatched yet. Its --check step fetches dependencies and the IPSW, so it is not an offline lint."]
next_action = ["Use the explicit diagnostic payload builder and the mandatory payload/ADT contract for raw RAM-root images; keep the pinned v5 baseline and the byte-identical v2 reproduction. The clean payload build is not bit-exact because the ADT random-seed is fresh; use the documented seed-normalized comparison for provenance and do not present it as a clean build. A supported seed pin remains host-only work.", "The reviewed UniXNU and device packaging changes are published on their branches. Merge the workflow onto the device default branch before an authorized CI run. Verify the runner image, Xcode and toolchain, then resolve the BOOT-size artifact scope. Do not dispatch the workflow, restore an upload step or flash the release artifact without owner approval."]
evidence = [{ kind = "source", reference = "docs/build-revisions.md", result = "Records the RAM-root report image sha256 45ecc93049757e97a8d71edb776f67e69df5c9c58be13543295c154637273e24 and the fs/timer image sha256 c12e601eceb8e5b5b9cf7a028c0f404653b67dc5ff5577813293673d2dea2b3a (flashed; the fs/timer fixture then passed on the tablet with RAMROOT-FST PASS: pid=1 page=4096 fs=read+seek+eof timer=poll), with their gitignored artifact directories." }, { kind = "source", reference = "docs/payload-build-recipe.md", result = "Records the historical-host payload replay: the clean payload 1d15ea68... differs from 31b78bec... only in the 64-byte ADT random-seed; the fail-closed seed-normalized payload is byte-identical, and packaging it reproduces the audit v2 image a34519c6... byte-for-byte. A second controlled clean build (c697903b..., boot 60ad9d05...) repeated the result. The build is preserved at out/gta4l/payload-testbuild-evidence with provenance.json and SHA256SUMS." }, { kind = "source", reference = "docs/upstream-packaging.md", result = "Records the adopted UniXNU release revision, the byte-identical template copy, the board package values, the iPadOS 17-only selection contract and the BOOT-size release limit." }, { kind = "source", reference = "docs/boot-dtb-provenance.md", result = "Records the byte-exact boot DTB reproduction from the Mu-Silicium board FDT and the ruled-out PixelExperience dtbo merge." }, { kind = "source", reference = "https://github.com/UniXNU/UniXNU/blob/6790e7ce6e77f67a9174fba1255e64eacf1c41ad/templates/package.sh", result = "Canonical package script source at the inspected upstream commit; the device copy is byte-identical." }, { kind = "host", reference = "scripts/package.sh", command = "cmp ../UniXNU/templates/package.sh scripts/package.sh; python3.11 - <<PY import tomllib ... PY", revision = "750bb6d59342bb63b94e4385e3c2e84694ec490a", result = "PASS: the device copy is byte-identical to UniXNU templates/package.sh (sha256 f7b8e3ea043058b9c61d5b45c32b8e7669a85737c89d55d404957c3b43ec4aab); the board parses and resolves [package] unixnu, boot_partition_bytes and the iPadOS 17 defconfig." }, { kind = "host", reference = "docs/upstream-packaging.md", command = "python3.11 -m unittest scripts.unixnu.test_profiles scripts.unixnu.test_pipeline scripts.unixnu.test_kernel", revision = "750bb6d59342bb63b94e4385e3c2e84694ec490a", result = "PASS (uncommitted working tree on base 6ee4ada8a82f5bd2d9032b4d7cf033e878e0551f): 19 tests. Profile resolution accepts 17 and the full name and rejects 26, 27, an ambiguous alias, an absent profile and an arm64e profile; manifest and verify cover the command-line and BOOT limits; mocked release checks cover step order, --check, --no-deps and failure-stop." }, { kind = "host", reference = "scripts/test-gta4l-boot-image.py", command = "python3.11 -B scripts/test-gta4l-boot-image.py; python3.11 -B scripts/test-gta4l-diagnostic-package.py", revision = "750bb6d59342bb63b94e4385e3c2e84694ec490a", result = "PASS: the boot-image gate self-test and the diagnostic packager self-test both complete; the new packaging files do not change either contract." }, { kind = "host", reference = "scripts/test-gta4l-packaging.py", command = "python3.11 -B scripts/test-gta4l-packaging.py", revision = "750bb6d59342bb63b94e4385e3c2e84694ec490a", result = "PASS: the packaging contract test checks the package values, the canonical script hash and template equality, and the DTB preflight truncation in an isolated tree." }, { kind = "host", reference = "docs/ram-root-fixture-reproducibility.md", command = "python3.11 -B scripts/test-gta4l-ram-root-fixture-recipe.py", revision = "750bb6d59342bb63b94e4385e3c2e84694ec490a", result = "PASS: the refreshed kernel.py pin and the baseline table match; the recipe input, compiler, dependency, replay and baseline failure checks all complete." }, { kind = "source", reference = "docs/firmware-dependency-decision.md", result = "Records the firmware input set and the preserved local Mu_Basecore decision." }, { kind = "source", reference = "docs/resolved-inputs.md", result = "Records the offline resolved-input inventory and its limits." }, { kind = "host", reference = "scripts/test-gta4l-packaging.py", command = "python3.11 -B scripts/test-gta4l-packaging.py", revision = "5fcd81b9db91a7d7a3e0f1efc59e1f7ea9b45d3c", result = "PASS on the working tree: the resolved iPadOS 17 profile, IPSW identity, cached kernelcache, local component pins, canonical script hash and template equality, preflight success/failure controls, stale-output truncation and launcher argument/interpreter propagation are checked without a build." }, { kind = "host", reference = ".github/workflows/package-gta4l.yml", command = "python3 - <<PY import yaml ... PY", revision = "5fcd81b9db91a7d7a3e0f1efc59e1f7ea9b45d3c", result = "PASS: static shape, action pins, profile and permission checks only; the workflow has not run on a runner and no artifact was produced." }, { kind = "host", reference = "scripts/audit-gta4l-resolved-inputs.py", command = "python3.11 -B scripts/audit-gta4l-resolved-inputs.py", revision = "5fcd81b9db91a7d7a3e0f1efc59e1f7ea9b45d3c", result = "PASS: offline inventory resolves the profile, IPSW members, feeds/lock, components, firmware dependency, boot DTB and kernel inputs; docs/resolved-inputs.md records the result." }]

