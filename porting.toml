schema_version = 1

[device]
name = "gta4l"
soc = "SM6115"
os_profile = "ipados-17.7.11-21H461"
summary = "Samsung Galaxy Tab A7 10.4 (2020) Format 2 migration; PMGR-linked host kernel, tablet RAM-root/EL0 fixture success and bounded QEMU checkpoints, eMMC bring-up pending."

[[area]]
id = "configuration"
status = "planned"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", ".gitmodules", ".github/**", ".circleci/**", ".gitignore", "local.toml.example", "gemini-code-*.py"]
inputs = ["Format 2 architecture, SM6115 SoC, iPadOS 17.7.11 21H461 and device profiles; board.toml and configs/gta4l_defconfig; the shared SM6115 DTSI."]
configuration = ["board.toml schema_version=2, soc_source=sm6115 and os_profile=ipados-17.7.11-21H461; CONFIG_XNU_NATIVE_PAN=n; CONFIG_XNU_ARMCPU=y and CONFIG_XNU_NATIVE_ARCH_TIMER=y; output out/gta4l/ipados-17.7.11-21H461/gta4l."]
procedure = ["./unixnu defconfig gta4l_defconfig -D ../UniXNU-gta4l; ./unixnu fetch -D ../UniXNU-gta4l; ./unixnu status --json -D ../UniXNU-gta4l; ./unixnu build kernel -D ../UniXNU-gta4l."]
findings = ["The SM6115 Cortex-A73/A53 cores are ARMv8.0 and do not implement PAN; the shared ARM64 profile enables PAN, so the board overrides CONFIG_XNU_NATIVE_PAN=n. TB128FU records the same undefined-instruction failure and the same override.", "The Format 2 resolver selects the expected arch/SM6115/OS/device layers and the output path above; the PT_LOAD/ADT records are built from dts/gta4l.dts and the shared SM6115 DTSI.", "The TB128FU device repository (xVanTuring/UniXNU-tb128fu) is the pinned reference for the timer, IPI and PMGR questions; docs/tb128fu-comparison.md records its credit, revisions and the limits on reuse.", "The .circleci workflow credential patch is scoped to trusted HTTPS GitHub hosts and strips the token headers on cross-host redirects; the porting record owns the removed gemini-code helper path so the gate accepts its deletion.", "The SM6115 SoC feed now points at gta4lunix/UniXNU-sm6115-common; the pinned commit is unchanged.", "The board archive list now includes build-gta4l-emmc-probe.py; the probe remains disabled unless the gta4l-emmc-probe boot argument is set.", "The board carries the release packaging contract ([package] unixnu, boot_partition_bytes, [package.defconfig] and [bootimg] dtb) and a manual package workflow. The workflow is static-validated only; it has not run on a runner and is not a published artifact contract. Its host-test step now runs scripts/test-gta4l-workflow.py, the packaging contract, the boot-image self-test and the diagnostic-payload builder test, and it has no upload step: image publication is disabled while the BOOT-size artifact scope is unresolved."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["The host kernel build and prelink pass. The successful tablet RAM-root image uses a test-scoped ad-hoc signed fixture and owner trust bundle; it is not an authenticated-root or production security result.", "The repository also carries three manual legacy kernel workflows, a CircleCI configuration and an automatic porting-record caller. They are not the canonical packaging path, are not validated here, and must not be dispatched."]
next_action = ["Use the explicit diagnostic payload builder and the mandatory payload/ADT contract for raw RAM-root images; keep the pinned v5 baseline and the byte-identical v2 reproduction. The next packaging change is required only for a new documented baseline or payload format."]
evidence = [{ kind = "source", reference = "docs/build-revisions.md", result = "Records the RAM-root report fixture result: PID 1, 4096-byte pages and mockfs exec; image sha256 45ecc93049757e97a8d71edb776f67e69df5c9c58be13543295c154637273e24; artifact out/gta4l/ram-root-report-evidence/ (gitignored)." }]

[[area]]
id = "firmware"
status = "planned"
components = []
paths = ["proprietary-files.txt", "scripts/extract-files.py", "scripts/gen-touch-firmware.py", "scripts/prepare-gta4l-boot-dtb.py", "docs/boot-dtb-provenance.md", "docs/firmware-dependency-decision.md"]
inputs = ["Mu-Silicium gta4lPkg firmware checkout; Resources/DTBs/gta4l.dtb (4,619,189 bytes, first FDT totalsize 316,095); [firmware] config=gta4l; UNIXNU_UEFI supplied by the release build step.", "Android boot-image inputs: BootShim, SILICIUM_UEFI.fd, appended board FDT and payload ramdisk; BOOT partition 100,663,296 bytes."]
configuration = ["board.toml [firmware] config=gta4l, dsc=Platforms/Samsung/gta4lPkg/gta4l.dsc, fd=Build/gta4lPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd, preflight scripts/check-gta4l.py and scripts/prepare-gta4l-boot-dtb.py; [bootimg] dtb=build/gta4l/boot.dtb."]
procedure = ["Follow the firmware and boot stage in the porting guide. The release firmware step passes UNIXNU_UEFI to the preflight scripts; prepare-gta4l-boot-dtb.py stages the first FDT from the firmware checkout and bootimg applies [[bootimg.dtb_node]] before appending it."]
findings = ["The reproducible firmware input set is the committed Mu-Silicium gta4lPkg, the pinned edk2 feed and the external UniXNU package/ and DarwinBoot sources; docs/firmware-dependency-decision.md records that the local dirty Mu_Basecore checkout is preserved as local work but is not consumed by the build.", "The boot DTB is the local Mu-Silicium gta4l board FDT, not the PixelExperience Android 11 release boot DTB plus dtbo overlay. docs/boot-dtb-provenance.md records the byte-exact reproduction of dc4c719d..., the further FDT images and trailing data in the source file, and the historical current-build differences (initrd-end and a regulator-max-microvolt length/value difference whose cause is unresolved).", "The firmware preflight reads [firmware] config, stages the source DTB truncated to its totalsize at build/gta4l/boot.dtb, and requires UNIXNU_UEFI. This is a host-only input staging step and does not change firmware code or eMMC behavior."]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["Host-only boot-DTB staging and dependency inventory; no firmware build, replay, flash or boot result is part of this record. The local Mu_Basecore modifications are preserved but not consumed by the build, and the firmware volume has little headroom."]
next_action = ["Resolve the BOOT-size artifact scope and the clean firmware input set before any authorized build or flash; push the reviewed tooling branch before an authorized CI run. Do not dispatch the workflow or flash from this record."]
evidence = [{ kind = "source", reference = "docs/boot-dtb-provenance.md", result = "Records the boot DTB provenance: the evidence DTB is reproduced byte-exactly from the first FDT in Mu-Silicium Resources/DTBs/gta4l.dtb plus the board dtb_node edits and initrd marks; the PE dtbo merge does not match." }, { kind = "source", reference = "docs/upstream-packaging.md", result = "Records the canonical release wiring, the firmware preflight staging of [bootimg] dtb, the iPadOS 17-only selection contract and the BOOT-size limit." }, { kind = "host", reference = "scripts/prepare-gta4l-boot-dtb.py", command = "UNIXNU_UEFI=../Mu-Silicium python3.11 scripts/prepare-gta4l-boot-dtb.py", revision = "750bb6d59342bb63b94e4385e3c2e84694ec490a", result = "PASS: an isolated tree with the device kit link and UNIXNU_UEFI pointing at Mu-Silicium stages build/gta4l/boot.dtb at 316,095 bytes, sha256 5c4c0599ff430bec71de6bb75663eb857c30ae368823d55054fd9a90e8eb77f8, from the 4,619,189-byte source." }, { kind = "source", reference = "docs/firmware-dependency-decision.md", result = "Records the firmware input set and the preserved local Mu_Basecore decision." }]

[[area]]
id = "cpu"
status = "planned"
components = ["ArmCpu"]
paths = ["package/CpuFreq*", "scripts/*armcpu*"]
inputs = ["SM6115: four Cortex-A53 and four Cortex-A73 cores, PSCI 1.0 SMC, GICv3 distributor 0xf200000 and redistributor 0xf300000 with 0x20000 stride, 19.2 MHz timebase, timer PPIs 1/2/3/0."]
configuration = ["CONFIG_XNU_ARMCPU=y, CONFIG_XNU_NATIVE_ARCH_TIMER=y, CONFIG_XNU_NATIVE_PAN=n; dts/sm6115.dtsi timer interrupts <1 1>, <1 2>, <1 3>, <1 0>; candidate boot argument armcpu-timer-intid=19."]
procedure = ["Boot the boot CPU first with the timer diagnostic counters; compare INTID 27 and INTID 19; test SGI delivery before enabling any SPI-IPI workaround."]
findings = ["The live timer specifiers match TB128FU: PPI 3 is the EL1 virtual timer, so INTID 19 is the gta4l candidate. The current ArmCpu default is 27 and INTID 27 may be another asserted source on this SoC; this is not yet measured on gta4l.", "TB128FU found SGIs undelivered and used software-pended SPIs 504..511 (INTIDs 536..543). Its GIC capacity and unused-line inventory do not transfer to gta4l; do not enable SPI IPIs before measuring ours.", "The TB128FU ArmCpu fork does not retain GICv2. Port only its timer/IPI mechanisms with per-device defaults so the shared GICv2 path stays intact."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["The kernel links on the host and the boot CPU ran the bounded fs/timer fixture on the tablet; that fixture's single blocking poll does not establish sustained timer stability. Secondary-CPU bring-up and IPI delivery are untested."]
next_action = ["Port the timer selection with the 27 default, test INTID 19 on the boot CPU, and record the interrupt counters before starting secondary CPUs."]
evidence = []

[[area]]
id = "memory"
status = "planned"
components = []
paths = ["dts/**", "package/*Smmu*", "package/*Memory*", "scripts/*smmu*", "scripts/*memory*"]
inputs = ["Captured SM-T505N FDT memory map; DarwinBoot/firmware reservations; 3 GiB dram_info; ADT generator's one-range requirement."]
configuration = ["dts/gta4l.dts memory@40000000 reg = <0 0x40000000 0 0xc0000000>; board.toml payload dram_size=0xC0000000 and payload.adt owned_memory_size=0x80000000."]
procedure = ["Compare the three live banks, the ADT span and the firmware reserved-memory map; confirm the free window before any hardware test."]
findings = ["The live FDT reports three banks: 0x40000000+0x3e580000, 0x80000000+0x20000000 and 0xa0000000+0x60000000, with a hole at 0x7e580000..0x80000000. The ADT generator requires one range, so 0x40000000+0xc0000000 is a physical span that includes the hole, not a contiguous free map.", "After the live no-map regions and the Mu-Silicium DDR reservations, the largest contiguous free run is 0x80000000..0x100000000 (2 GiB). DarwinBoot requests that window; the previous 3 GiB request had no qualifying run and would stop at NO WINDOW.", "The captured unit reports 3 GiB; TB128FU's 0x180000000 span and 0x100000000 owned window describe a different memory population and must not be copied."]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["The 2 GiB window is a static derivation from the live FDT and Mu-Silicium map; the runtime UEFI map has not been observed on the tablet. The first boot must validate DarwinBoot's allocation."]
next_action = ["Boot the diagnostic image with the 2 GiB request and capture DarwinBoot's BIG RUN/FREE rows if it fails; do not change the window without those rows."]
evidence = []

[[area]]
id = "storage"
status = "planned"
components = []
paths = ["drivers/ShengUfs", "scripts/*ufs*", "scripts/*storage*", "scripts/*userdata*", "scripts/*root*", "scripts/*gpt*", "package/Gta4lEmmc*", "scripts/build-gta4l-emmc-probe.py", "scripts/sim-gta4l-emmc/**", "scripts/sim-gta4l-emmc-probe/**", "scripts/test-gta4l-emmc*", "scripts/extract-gta4l-pe-artifact.py", "scripts/test-gta4l-pe-extract.py"]
inputs = ["Identify the storage and root hardware, resources and existing component interfaces for this board. Reference-only inputs: limonabisi/linux-gta4l gta4l-7.2 at cf5f763f0ef8a5b4d8bb4163833cba1160c51894 (board DTS credits V6lhost; SoC DTSI credits Iskren Chernev) and itsChris122/UniXNU-guamp at 6be83ac10b4eee84d504266bb8d12ef64a083acc and Dracen-W/NativeEmmc at 4980f1070b0c822dedb9eb350df710a57df28590 (maintainer Dracen; catalog community-native-emmc; static audit in docs/native-emmc-reference-audit.md). The dolbaras PixelExperience Plus 11 gta4l release 2026-10-07 (asset SHA-256 3adbec9c4066b0efe571274346c710162d5692dd184e513d7cb5276379cc7605) and its kernel lineage-18.1 anchor 5a3272a3e1de7dcc68ad452ca2d36e6c3bbb594a, device eleven-plus 3276f5b69e92dd9f609ee29ea7bec31c7db6fc98 and common lineage-18.1 3f21d1579bc3f41afd5687d4d71843b22b528249 are a provenance anchor; the release manifest pins branches only and source-to-artifact identity is unresolved; comparison in docs/pe-storage-stack-provenance.md. No reference code is imported."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for storage and root."]
procedure = ["Read the live FDT, primary/backup GPT and recovery sysfs read-only; validate GPT CRCs and array equality with scripts/verify-gpt.py; resolve controller resources from the stock FDT before implementation."]
findings = ["RAM-backed mockfs root and a signed static EL0 fixture succeeded on the tablet without the AMFI bypass arguments: PID 1 and 4096-byte page-size syscall observed. The fs/timer fixture then passed with reads of distinct 4 KiB pages, seek/reopen/EOF and one blocking poll() timeout. These are bounded fixture results, not an eMMC or authenticated-root result.", "Recovery inventory: eMMC is mmcblk0 at /sys/firmware/devicetree/base/soc/sdhci@4744000, compatible qcom,sdhci-msm-v5/qcom,sdhci-msm-cqe; registers are 0x4744000+0x1000, 0x4745000+0x1000 and 0x4748000+0x8000; clocks are iface_clk, core_clk and ice_core_clk; reset is core_reset; supplies are vdd and vdd-io. Recovery reports HS400 Enhanced Strobe, CQHCI and 64-bit ADMA.", "The eMMC is a 29.1 GiB DX68MB (Samsung CID 150100445836384d42009005f4661900, CSD d02701320f5903fff6dbffef8e404000, 61,071,360 logical 512-byte sectors). The live FDT matches the pinned stock FDT and the CRC-valid primary/backup GPTs agree on 80 partitions. These are recovery observations, not an XNU driver result.", "The corrected v5 observation-only snapshot ran on the tablet and reported v=10000072 (major 1, minor 0x72), sv=7202, c=742dc8b2, c1=0000808f, ps=01f800f0, clk=0003, pwr=00, hc=00, hc2=0000, is=00000000 and ie=00000000. This establishes the v5 version offset and the gated map/read/panic path, not card protocol or storage access.", "A separate read-only XNU handoff audit now observes the SM6115 GCC SDCC1 reset/branch/RCG state and the v5 vendor power status/mask, capability and DLL state without writing or acknowledging power requests. Its first boot image was withdrawn after a BOOT-only packaging failure (minimal DTB instead of the working v5 boot DTB); the pre-flash BOOT partition was restored and confirmed, and a corrected image preserving the v5 boot header, firmware, boot DTB and boot kernel section exactly then booted and completed the read-only audit. It reports bcr=00000000, ac=00004221, ahb=00000001, ice=00004229, cmd=00000000, cfg=00000401, m=00000001, n=000000fe, d=000000fd, clk=0003, pwr=00, pst=00000000, pm=00000000 and dll=00000000. This is register-level handoff evidence, not card or storage access.", "The bounded host-local init probe is implemented in package/Gta4lSdhciHostInit.c/.h and compiled into the diagnostic archive (archive sha256 3cccb9e9d25a7e93b470c718e50b53edf50b975956259b37c851538f9c730b0f; host-init object sha256 2dac8c6e09d510e2d2c052aa599f630eec7950cc932547dd71657de793c7f2b9). It writes only SDHCI interrupt enable/signal enable (0x34/0x38), standard software reset (0x2F) and clock control (0x2C); disassembly shows no other MMIO stores. scripts/test-gta4l-sdhci-host-init.py passes its allowlist, write-contract, conflict and bounded-wait self-test; the audit hardened its MMIO check to reject reordered volatile qualifiers, typedef-hidden stores, whitespace-split stores, pointer-index stores and non-volatile pointer casts and added matching self-test cases; those source patterns are guardrails, not a proof of absence. scripts/test-gta4l-sdhci-host-init-sim.py replaces the production MMIO helpers with logging hooks, asserts the exact write sequence, records every read and write so a same-value transient write is rejected, and disassembles the run function to confirm a pointer-index mutation adds memory stores the event trace would not see. and covers conflicting arguments, an absent boot argument, an SDHCI map failure, a GCC-only map failure, bus power, reset timeout, unstable clock, interrupt suppression with nonzero enable registers, an ignored interrupt-clear failure, a pending vendor power request, a device-side vendor change, GCC reset/branch/RCG preconditions, delayed reset/clock completion, post-reset state changes and a stuck clock counter. The completion line is now HOST INIT REPORT with an explicit \"vendor state reported, not enforced\" qualifier; the historical tablet transcript keeps its earlier HOST INIT OK wording. The kernel relink succeeded (kernel sha256 ba52b6500ec3d064d173fa06fba23cb42aa4850c0bddd0df9a4178666c084646) and bsd_init calls preflight/audit/snapshot/host-init in order. The first 80 MiB payload inherited packed_data_ramdisk=true, so its ADT reserved PackedRAMDisk while the raw N4KROOT scratch-data.img reports RamdiskPacked=FALSE; DarwinBoot returned EFI_COMPROMISED_DATA at the UniXNU picker. BOOT was rolled back byte-for-byte (pre-flash backup 55d80d52a7246acec8277a8aeb40e38b2b2aac1eadef1e5d439579d86a7cd701; failed readback 73b7a586ee2498277dc77adc7b81714afa0662d36c8dfc48b8c0a2ec456e01b6; rollback readback 55d80d52a7246acec8277a8aeb40e38b2b2aac1eadef1e5d439579d86a7cd701). The corrected payload sets packed_data_ramdisk=false; its ADT reserves RAMDisk, payload sha256 0afaae8d66251d61c74d80427289da5e79551e52652e5236adaac55c6c8ac8b1, boot image sha256 d4aee57a9d1874d23dc010b7de43384ace6ab29241f5ee18cb10f0a561bab133, and both the 18-check boot-image gate and scripts/check-gta4l-payload.py pass. Corrected v2 was then flashed to BOOT; the image-byte readback matches d4aee57a9d1874d23dc010b7de43384ace6ab29241f5ee18cb10f0a561bab133, the full partition readback is 7ff725aacfbd5e205f98c6c71229e59908e432491cda91d2257f566d2925874a, and the readback gate is 18/18 with the extracted payload contract passing. The owner's manual boot then completed the host-local probe: reset=00, clk=0003, pwr=00, ie=00000000, se=00000000, and unchanged vendor values g=00f04003, pst=00000000, pm=00000000, vs=00300a0c, ddr=80040873, dll=00000000. The GCC row is the pre-write capture. No card command, data transfer, DMA, storage write, bus-power enable or card-clock enable was issued. This is controller-local evidence, not PM6125 L24/L11 rail state. Evidence: out/gta4l/ram-root-sdhci-host-init-evidence/host-init-success.txt and host-init-success-photo.jpg (photo sha256 672ecf61d0cb3e5675c5f511e88f3250a3f507afaf0acad84ee3153d97acc967).", "The pinned mainline gta4l port at cf5f763f0ef8a5b4d8bb4163833cba1160c51894 enables sdhc_1 without vmmc-supply or vqmmc-supply; pm6125_l24a and pm6125_l11a are defined but unreferenced, while only sdhc_2 uses L22/L5. Its RPM path is GLINK over sram@45f0000 (qcom,glink-smd-rpm), not the live FDT's legacy qcom,rpm-smd node. This is a retained-rail design, not proof of the XNU-time rail state.", "The mainline qcom_smd-regulator driver exposes cached is_enabled and uV only; it has no RPM query or PMIC register read. qcom_glink_rpm_probe writes zero to the TX head and RX tail and sends a GLINK version command, and opening rpm_requests requires an open/intent handshake. A read-only XNU audit can inspect the RPM message-RAM TOC and FIFO pointers but cannot derive L24/L11 voltage or enable state, and must not reset the FIFOs or ring the mailbox.", "Step 4 records the board-level electrical-contract assessment in docs/sdhc-electrical-contract.md. It selects a bus-power-only candidate and finds all nine safety-critical areas (E1–E9) blocking: supply voltage/absmax, IO compatibility, current/loading, transients, sequencing, back-powering, retention, fault handling and recovery. DT ranges and current levels are operating intent, not measurements. Step 5 adds a versioned access trace, 33 deterministic scenarios, ten negative-control mutations and a separate-implementation oracle (same author) for the existing controller-local probe only; the oracle derives its rules from the header and write contract rather than the harness arrays. All host tests pass, but they do not cover bus-power or card-clock activation.", "Step 6 records a dated NO-GO decision in docs/sdhc-decision-memo.md for sdhc-bus-power-activation. The gate table fails electrical contract, starting state, access policy, software behavior for that candidate, independent assessment, recovery and authorization. No bus-power-only implementation, image, access policy or measurement exists; the host-local diagnostic approval does not transfer.", "The Dracen-W/NativeEmmc audit (commit 4980f1070b0c822dedb9eb350df710a57df28590, maintainer Dracen) is a host-only static review of a MediaTek MT6768 MSDC driver, not a Qualcomm SDHCI v5 port: its register map, command encoding, FIFO path and hardcoded userdata LBA are not transferable. Its staged boot arguments, IOBlockStorageDevice shape, write rejection, global controller lock, fail-closed manifest checks and exact-one-match IOMedia lookup are useful design references. The audit also records a completion gap (success after draining bytes without XFER_COMPL), an unconfirmed stop-on-error path, no R1 card-status check, no window content-hash verification, and a source/license mismatch (BSD-2-Clause-Patent versus BSD-2-Clause LICENSE). No code was imported, built or run, and the repository documents no hardware result.", "The consolidated power/pad dependency report (docs/sdhc-power-pad-dependency-report.md) corrects the SdccDxe controller-local handshake: it sets the SDHCI bus-power bit, resets the controller, and writes the IO_SUCCESS (4) or BUS_SUCCESS (1) result bit to CORE_PWRCTL_CTL after bounded status/clear polls (up to 10,001 reads each) and a 10,000-read reset self-clear poll, with no PMIC/LDO/RPM action; CORE_PWRCTL_CTL carries success/fail results, not the BUS_OFF/IO_LOW request bits, which live in CORE_PWRCTL_STATUS. It is not a bus-power-on regulator sequence. The pinned pinctrl driver and sm6115.dtsi map the UEFI 0x9fe4 write at 0x575000 to the SDC1 QDSD group at west+0x75000, and the value matches the vendor sdc1_*_on drive/pull fields, closing only the write-to-pad mapping part of E2. L24/L11 physical state, the SDC1 pad domain and actual levels, PM6125 fault semantics, electrical sequencing and recovery, and the CX/ICC/SMMU state remain unmeasured. No electrical E/S gate closes and the bus-power decision remains NO-GO; the next step is a measurement-only baseline or the missing datasheets, schematic, safe test points and recovery procedure. A host-only regression test, scripts/test-gta4l-sdccdxe-decode.py, pins the SdccDxe hash and the handshake instruction words and checks the captured-status selection, the three non-aborting timeout paths, the loop bounds and the TLMM pad decode; it does not execute firmware.", "The 2026-10-31 porting-approach reassessment records the owner-directed decision that software porting may proceed with the mainline Linux, vendor/LineageOS and captured-firmware stack as the reference, that electrical characterization is not a porting prerequisite, and that the NO-GO applies only to the on-device bus-power activation operation. It lists the dependencies to reproduce and keeps the residual electrical, RPM-retention, UEFI-volume and boot-medium risks open; no E1-E9 or S1-S4 gate is marked closed.", "A native SDHCI v5/eMMC core is implemented and host-tested in package/Gta4lEmmc.c: controller reset, GCC 400 kHz setup, status-enable polling, separate bus/IO power requests that require an observed BUS_ON completion and the latest acknowledged IO level to match the desired HOST_CONTROL2 level, with an unchanged VDD_180 bit still rejecting an observed wrong level, a bus-on acknowledgement carrying both BUS_SUCCESS and IO_SUCCESS, an exhaustion failure instead of a quiet-window success, an explicit fixed-1.8 V signalling and pad-supply policy, CMD3 RCA assignment, normalized SDHCI long responses, 512-byte sector-size enforcement, enumeration, capacity/partition validation and single-block PIO reads. The host simulator covers 98 scenarios and 55 mutation controls after the stage-3 audit added the GCC SDCC1 block reset, clock-before-vendor-access ordering, the CORE_VENDOR_SPEC POR restore, the CORE_VENDOR_SPEC3 PWRSAVE_DLL clear, the low-speed DLL_RST/DLL_PDN pair and terminal-command-failure capture; a follow-up audit added clock-gated failure reporting, retirement of recovered CMD1 timeouts, failed branch-clock enables with no SDHCI access, recovered and exhausted CMD1 timeout scenarios and enforcement of the reset pulse, branch-clock ordering and DLL reset-before-power-down sequence; a later audit added CMD1 and pre-CMD2 response-window capture, status-clear invalidation, reinitialization clearing and the recorded not-ready-then-ready CMD2 CRC sequence; the staged gta4l-emmc-probe=1/2/3 XNU probe is linked through build-gta4l-emmc-probe.py and the board patch series. The probe has not been run on the tablet when this finding was written, and no block-device publication, filesystem mount, DMA, CQE, ICE, write path or microSD path exists.", "The native SDHCI v5/eMMC stage-2 probe ran on the tablet on 2026-10-31 (SM-T505N, TWRP 3.7.1) and panicked with GTA4L-EMMC HOST REPORT rc=0 mci=10000072 pwr=0f clk=0007 hc2=0008 ven=00318a0c pst=00000000 log=4/1/268435570. The image was written to BOOT only; the first 85,688,320 bytes read back identical and recovery stayed byte-identical TWRP 14e11370c40fd5b70a3dba1d49283e938001141c9d5f8de6685653e6a793f5ae. This establishes controller reset, bus/IO power completion, pad policy and card clock at the controller-local level; card identification, CID/CSD/EXT_CSD, sector reads, rail voltages and retention remain unproven.", "The native SDHCI v5/eMMC stage-3 identification probe ran on the tablet on 2026-10-31 (SM-T505N, TWRP 3.7.1) and failed before the identification report: GTA4L-EMMC PROBE FAILED stage=3 rc=4294967288 (0xFFFFFFF8 = -8 = GTA4L_EMMC_ERR_CMD_CRC) mci=10000072 pwr=0f clk=0007 hc2=0008 ven=00318a0c pst=00000000 cfg=00002017 cmd=00000000 log=4/1/268435570. The controller registers repeat the stage-2 host-init state and the last log event is the completed controller reset, so host init completed and a card command failed a response CRC check. The earlier transcript is un-attributed. A later photograph of the same stage, using the owner-corrected DLL value, adds clocks=1 pwr=0f clk=0007 hc2=0008 ven=00018a9c dll=6000642c dst=00000000 pst=00000000 cfg=00002017 cmd=00000000 bcr=00000000 apps=00004221 ahb=00000001 step=8 fail=1/2/0/00000209/0002/8000/03f800f0/8 log=5/8/2/163840. That record attributes the failure to CMD2: argument 0, command register 0x0209 (RESP_LONG|CRC), ERROR_INT_STATUS=0x0002 (CMD_CRC), and last_step=8 (CMD1 readiness completed). CMD0 has no response and CMD1 is sent without CRC, so the first CRC-checked command is CMD2; CRC checking remains enabled and is not bypassed. The earlier transcript without fail= remains historical and is not treated as an independent run. CMD1 OCR was observed; no validated RCA, capacity, EXT_CSD, CID, CSD or sector result was obtained, and no sector read was issued. The image was written to BOOT only; the previous stage-2 boot was saved, the first 85,688,320 bytes read back identical and recovery stayed byte-identical TWRP 14e11370c40fd5b70a3dba1d49283e938001141c9d5f8de6685653e6a793f5ae. This is a failing state, not an established identification: it establishes the repeated host state and the failed attempt only.", "A host-only audit of the stage-3 failure against the pinned Linux sdhci-msm, mmc-core and sm6115 references produced four host-code fixes without device access: the core now asserts and releases the GCC SDCC1 BCR reset (200 us each) before the first register access and enables the AHB/APPS branches first; it restores CORE_VENDOR_SPEC to the documented POR value 0xA9C, clearing the observed leftover HS400 MCLK_SEL/HC_SELECT_IN field state; at low speed it clears PWRSAVE_DLL (bit 3 of CORE_VENDOR_SPEC3, 0x250) in addition to DLL_RST then DLL_PDN in CORE_DLL_CONFIG (0x200); and it records the terminal failing command (index, argument, encoded command register, error/normal interrupt status, present state and last completed step) before clearing the latches. Recovered CMD1 busy timeouts are retired before each retry, so they cannot mask the command that ends initialization. SDHCI diagnostics are read only when the AHB/APPS branches were enabled, with the GCC BCR/CBCR state always reported. The probe also reports CORE_DLL_CONFIG/CORE_DLL_STATUS and the failure record. The simulator and tests were extended to 98 scenarios and 55 mutation controls, including failed branch-clock enables, recovered and exhausted CMD1 timeouts and a clock-gate mutation control, and pass; a separate host test executes the probe failure report with simulated MMIO and panic stubs, requires zero SDHCI accesses when a branch clock is stuck, and rejects an unguarded-read mutation; this remains host-only evidence and does not establish the stage-3 cause or a card result.", "The diagnostics-only cmd2window image ran on the tablet on 2026-10-31 and did not reproduce the terminal CMD2 CRC error: CMD2 was accepted by software and CMD3 ended in a software completion-poll timeout (rc=-7, fail_index=3, fail_command=0x031A, fail_error=0, step=9). The failed window held CID words 2..4 and a plausible CMD3 R1 status (RESPONSE0=0x00000500), so the low response word is suggested to be CMD3 R1 status, but the correct CID decoding and the exact completion failure remain unestablished, and intermittent electrical/CRC faults are not excluded. The working tree extends that to a diagnostics-only fmt=4 capture (raw CMD2 window, pre-CMD3 status/enable readbacks, CMD3 poll history, CMD7 pre-command/poll/first-CC-TC/terminal/trace fields, fresh post-timeout status/command/argument/response and HOST_VERSION) plus simulator scenarios for no/late/stale completion, status-enable mismatch, the photographed raw layout, the non-timeout path and the CMD7 R1b cases (TC only, changed/unchanged windows, CC-then-TC, TC-then-CC, simultaneous, CC-only bounded timeout, busy-phase error, late busy error, an error asserted during the terminal diagnostic reads on the busy-completion success path and trace overflow); the probe simulator now also models the full identification sequence and checks the actual report text for CMD3 no-CC/late-CC, CMD9 timeout, successful identification and the CMD7 cases, including the success-path capture with the counter frequency; the fmt=2 image ran on the tablet on 2026-10-31, completed CMD2/CMD3/CMD9 and stopped at a CMD7 R1b completion timeout (rc=-7, fail_index=7, fail_command=0x071B, fail_error=0, fail_normal=0x0002 = TC with CC absent, step=11), recorded in docs/emmc-cmd2-crc-audit.md section 2.8 and decoded in docs/emmc-cmd7-timeout-finding.md. The fmt=4 fail-closed image was run on 2026-11-01 on two units (an SM-T505 and the owner's SM-T505N, per the owner); both failed with the same -8/CMD_CRC failure record and response window as the section 2.6 image, so the CMD7 capture was not exercised (sections 2.9-2.10; driver section 5.3.3; the later unit's flash record, pulled-prefix gate rerun and photo are under out/gta4l/ram-root-emmc-probe-failclosed-rerun-evidence/). CRC checking remains enabled and no snapshot is promoted to a CID.", "The dolbaras PixelExperience Plus 11 (Android 11) gta4l/SM-T505 release 2026-10-07 is a host-only vendor-stack reference; the local asset matches the published 1,420,855,324-byte size, the release-table MD5 6aa86a41ecef08ce4157ccc1d379631c and SHA-256 3adbec9c4066b0efe571274346c710162d5692dd184e513d7cb5276379cc7605. Its boot image (board SRPTC24A004, Android 11) splits into 12 base DTBs and 40 dtbo entries; applying Bengal base 00 and QRD overlay 00 reproduces the live FDT sdhci@4744000 property set (L24A/L11A, 2.96/1.8 V, 8-bit, 400 kHz..384 MHz; property order differs). The pinned source is vendor-lineage 4.19.300 (kernel lineage-18.1 at 5a3272a3), not mainline: sdhci.c differs by 4 nonempty changed lines from the pinned LineageOS vendor copy and 2,565 from mainline, sdhci-msm.c by 51 and 6,957, and core.c by 29 and 1,726 against mainline MMC core mmc-core.c (the earlier 8,209 figure compared the regulator core.c and is withdrawn). The inspected vendor source sends CMD7 as R1 (mmc_ops.c:98) with no in-command busy wait; max_busy_timeout=0 and MMC_CAP_WAIT_WHILE_BUSY | MMC_CAP_NEED_RSP_BUSY (sdhci-msm.c:5998-6002) affect explicit R1B erase/switch/sleep commands, not CMD7. The XNU port sends CMD7 as R1B and requires CC+TC, so the device-tested SM-T505 reference neither reproduces nor disproves the recorded TC-only port timeout; no TC-only workaround, quirk, timeout increase or vendor code is imported. The release manifest pins branches only and the artifact build predates the pinned heads, so source-to-artifact identity is unresolved; only SM-T505 was device-tested and the owner is SM-T505N.", "A host-only CMD1-to-CMD2 timing candidate is specified in docs/emmc-cmd1-gap-candidate.md. It adds only an 8-us delay after an accepted ready CMD1, before CMD2, matching the pinned downstream mmc_ops.c udelay(8) placement. The simulator model is explicitly hypothetical and does not reset on the status clears; a final-clear-rearmed model would be a separate candidate. The core test now runs 98 scenarios and 55 mutation controls, including the delay-present, not-ready, short-delay and delay-removed cases. The existing fmt=4 image (4d2f7975...) remains the unchanged baseline; the candidate was built from 2a3268c7, flashed to BOOT only and run on 2026-11-01 on three units (the owner's SM-T505N and two owner-reported SM-T505s). All three completed the stage-3 identification sequence (GTA4L-EMMC IDENT REPORT rc=0, step=15, CMD7 CC and TC observed); the owner's unit had failed CMD2 on the fail-closed image, and the delay is the only source delta between the two images. The results are owner-supplied text without a photo file or hash in the tree. They support a timing-sensitive contribution for these runs but do not establish the CMD2 cause or prove the delay necessary (cmd2window and fmt=2 passed CMD2 without it), and no general fix is adopted.", "The 2026-11-02 stage-1 full probe (emmc-probe-1) was built from 417acc4d with the committed cmd1gap source and run on the owner's SM-T505N and one SM-T505. The SM-T505N has a BOOT-only flash record (pre-flash 92f4000e, post-flash 421e8848, image-byte readback bf73a39b, tail a28b4ea2 and RECOVERY 14e11370 unchanged, pulled gate 18/18 and payload contract 7/7); the SM-T505 run has no flash record and its image identity is owner-reported/shared. Both reports reached GTA4L-EMMC PROBE REPORT rc=0 with step=15, log=7, identical block 0 words (protective MBR type 0xEE, start LBA 1) and identical block 1 words (EFI PART, revision 1.0, 92-byte header); the recovery-known CSD matches on both units and the owner's CID matches the recovery-known CID. The block 0 fingerprint is identical and the block 1 fingerprint differs between units, consistent with a shared protective MBR and a per-device GPT header (disk GUID/header CRC), not corruption. This is the first sector-read content evidence; it is not a filesystem, multi-block, reliability, publication or write result. The probe report does not print the MBR signature or the GPT header CRC, but an owner-authorized read-only recovery-side readback of blocks 0 and 1 on the owner's SM-T505N independently reproduces both (the GPT header CRC computed with its CRC field zeroed), documented in docs/emmc-cmd2-crc-audit.md section 2.12; the SM-T505 is not re-verified this way, and CRC checking remains enabled.", "The 2026-11-02 stage-A extended content read rebuilt the emmc-probe-1 diagnostic from 53753df with the same core (Gta4lEmmc.c 874e6878, Gta4lEmmc.h 7e063c08) and probe source 034571f1; archive 57ed9995, payload fdd85d25 (83,886,080 bytes, gta4l-emmc-probe=1, contract 7/7) and boot image 721e5c87 (85,688,320 bytes, gate 18/18 against the ce4d76e8 v5 baseline). The SM-T505N flash was BOOT-only and its record is under out/gta4l/ram-root-emmc-probe-stage2-evidence/ (pre-flash 421e8848, post-flash d55c09bf, image-byte readback 721e5c87, tail a28b4ea2 and RECOVERY 14e11370 unchanged; no other partition was written). The owner-supplied report reached GTA4L-EMMC PROBE REPORT rc=0 with step=18, log=30, the GPT gate elba=2 n=84 sz=128 first=34 last=61071326 backup=61071359, per-LBA sums for the 21 primary-array sectors LBAs 2..22 (LBA 22 is all-zero because only entries 1..80 of the 84-entry array are populated), DATA 34=f418cd33 and LSTLBA=61071359 sum=a89b26d5. Every one of those sums reproduces from a same-session read-only TWRP readback of LBAs 0..33, LBA 34 and LBAs 61,071,326..61,071,359; the live primary GPT sectors are byte-identical to the pinned recovery dump, the backup tail is byte-identical to the pinned backup dump, both header CRCs are valid (41c874ee/fde724e6), the backup array equals the primary array, and the LBA 0/1 hashes match the stage-1 readback. This closes the Stage-A/F1 content claim: repeated single-block CMD17 reads at the fixed identification clock (1-bit, CRC enabled) covered the GPT header, the whole primary array, the first usable sector and the last sector, and every content sum is bound to live bytes. It is not an F2 CMD18/CMD12 multi-block transfer, an F3 bus-width or F4 high-speed result, an F5 publication, an F6 write, a filesystem result or a media-reliability test; DMA, CQE and ICE remain absent, CRC checking stays enabled, and the photo/sector hashes stay in the gitignored out/ record.", "The 2026-11-02 optional A2/F2 multi-block attempt (gta4l-emmc-mb=1 with gta4l-emmc-probe=1) did not reach the CMD18 phase: the pre-correction image stopped during identification at the known CMD3-completion timeout (rc=-7, step=9=STEP_CMD2, c3l bound exhausted, RESPONSE0=0x00000500 with CID words 1..3), so no multi-block transfer or sector read occurred and F2 is not established. The post-attempt checker audit found that the CMD18 transfer-mode word omitted the SDHCI Multi/Single Block Select bit (0x0020); the working tree now sets it (TM_READ | TM_BLOCK_COUNT_EN | TM_MULTI), both simulators reject a CMD18 without it, and both suites include a mutation control that removes it (core 112/62, probe 44/34). A corrected image and a separately approved BOOT-only attempt are required; a second pre-MD stop is not an MD verdict.", "The 2026-11-02 A2/F2 attempts 2 and 3 corrected the missing CMD18 Multi/Single Block Select bit and added a bounded 500,000 us post-bound drain, but F2 remains unproven. Attempt 2 issued one open-ended CMD18 over the 21 GPT-array sectors and stopped at block ordinal 20 with rc=-11 (no latched controller error, no TC) after the 1,000,000 us primary bound; the explicit CMD12 stop did not report CC or TC within its bound. Attempt 3 was flashed to BOOT only (image f85c18d9, readback verified, RECOVERY/EFS/sec_efs unchanged) and booted three times without reflashing: boot 1 stopped during identification at the H8 CMD3-completion timeout (step=9, no CMD7/CMD18/CMD12); boot 2 reached the MD phase and exhausted the 500,000 us drain window (drain=1/0/0/50000) with no additional block and no TC, then the CMD12 stop again timed out; boot 3 failed the stage-A CMD17 read at LBA 2 with rc=-11 and normal 0x0002 (TC only). H8 is therefore intermittent across boots, the ordinal-20 stall reproduced, and the drain did not resolve it. No 21/21 transfer, completed stop, MB sums or content comparison exists; the reports are owner-supplied OCR text, and the image was not re-read after boot 1.", "The 2026-11-02 Stage-B1 bus-width/bus-test rung (gta4l-emmc-probe=4) is implemented and host-tested; the later 2026-11-02 hardware run (appended finding) stopped at the 4-bit readback, so F3 remains unproven. The probe switches EXT_CSD BUS_WIDTH (byte 183) to 4-bit and then 8-bit with CMD6, waits for the switch to leave busy, sets the matching SDHCI HOST_CONTROL bit (0x02/0x20), reads EXT_CSD back at the new width and requires the masked value to match, then runs one CMD19/CMD14 bus-test round trip per width (4 bytes 5a 00 00 00, 8 bytes 55 aa 00 00 00 00 00 00; compare the first length/4 returned bytes with the complement). After each width it repeats the stage-A content pass over blocks 0/1, the 21 GPT-array sectors, the first usable sector and the last sector and compares every sum with the 1-bit baseline; the gated LBA list is reused rather than re-gated. The first failure stops the rung. The report (GTA4L-EMMC B1 REPORT) carries the 1/4/8-bit lines with requested/readback width, switch/test result and test words, HOST_CONTROL, block sums and content-divergence LBA, the per-width BLOCKS/DATA/LSTLBA lines, the TLMM QDSD/CORE_DLL_CONFIG/CORE_DLL_STATUS sample and the terminal FAIL record, and fits the 2048-byte panic buffer at the field-wise maximum. sw is the byte-183 readback, not a success flag: an 8-bit CMD6 that leaves the card at 4-bit reports req=8 sw=1 swrc=-19 and the host width is reverted. There is no BUS_INTF timing node in the live DT or vendor tree; the closest vendor property is qcom,bus-speed-mode on sdhci@4744000 (merged.dts:3030,3050), which the probe does not parse, so bif=none is a not-read marker. The core suite is 136 scenarios/80 mutation controls and the probe suite is 55/34, including 4/8-bit success, CMD6 error/stuck/busy/invalid/pre-init, CMD19/CMD14 timeout/CRC/status, 4/8-bit pattern mismatch, width mismatch and the B1 failure reports. The only card writes are the BUS_WIDTH configuration byte and the CMD19 test pattern; CRC stays enabled, the clock and bus-power state are unchanged, and no user-data sector is written. A 4-bit hardware CMD19/CMD14 success with matching content is the plan's F3 PASS at 4-bit; an 8-bit failure must bind to swrc, trc/tw/te or div.", "The 2026-11-02 Stage-B1 hardware run used the verified B1 image: kernel f25d3cee, payload cf08c1b2 (contract 7/7) and boot image 327fe8c9 (gate 18/18), BOOT-only flash pre p69 d652a8b5, post p69 1c64333a, prefix 327fe8c9, tail a28b4ea2, RECOVERY 14e11370/EFS 51fa824c/sec_efs 3a265d58 unchanged, pulled gates 18/18 and 7/7. The owner booted the same image three times without reflashing. Boot 1 stopped before B1 at the H8 CMD3-completion timeout (stage=4, rc=-7, step=9, no C7 or width command). Boot 2 completed identification and the stage-A pass (step=18, log=30, baseline b0=62084b66 and b1=84d0543e) and stopped at the 4-bit switch: the post-switch EXT_CSD byte 183 read back 0 instead of 1 (sw=0, swrc=-19, GTA4L_EMMC_ERR_BUS_WIDTH), the host width was reverted, and no CMD19/CMD14 or per-width content pass ran; the per-width b0/b1/same/div fields are zero-initialized, not a content result. Boot 3 stopped before B1 at the block-1 CMD17 with rc=-11 and normal 0x0002 (TC only, no CC or BRR). The attempt-2 report matches the simulator's stuck-readback case field-for-field; the attempt-3 TC-only sample has no field-for-field simulator case, because probe-read-timeout expects a latched DATA_TIMEOUT with error 0x0010 and normal 0. The report does not distinguish a card-side no-op from a stale readback or a host-width write issue. F3 is not established; no code change follows, and the planning model must rewrite the B1 plan before any further build, flash or boot.", "The 2026-11-02 Stage-B1 report-completeness audit is host-only and extends the B1 result without changing the command sequence, registers, clock/power state or card writes. It adds switch_status (CMD6 R1), host_before/host_after (HOST_CONTROL around the width write) and readback_sum (byte sum of the EXT_CSD read at the width) to the bus result, prints hb/ha/c6/es on every BW=4/BW=8 line, and prints both the pre-rung and final QDSD/CORE_DLL_CONFIG/CORE_DLL_STATUS samples. The three readback causes now have distinct simulated tuples: card ignored the switch c6=00000900 ha=02 es=<1-bit sum> sw=0 swrc=-19; empty readback c6=00000900 ha=02 es=00000000 sw=0 swrc=-19; lost host width c6=00000900 ha=00 es=00000000 sw=0 swrc=-12. A pad/DLL disturbance is observable only as a p*/q* sample difference and is not simulated. The fields observe the pinned order SDHCI_HOST_CONTROL 0x28 / SDHCI_CTRL_4BITBUS 0x02 / SDHCI_CTRL_8BITBUS 0x20 (drivers/mmc/host/sdhci.h), mmc_select_bus_width() at drivers/mmc/core/mmc.c:1022 and mmc_compare_ext_csds() at :729; they do not change it. gta4l_emmc_ext_csd_sum() is factored out and shared with gta4l_emmc_parse_ext_csd(). Host checks: the probe suite is 57 scenarios/34 mutation controls (55/34 before), adding probe-b1-zero-readback and probe-b1-host-width-stuck next to the existing probe-b1-stuck-width; the core suite is unchanged at 136/80; the report-width-b1 fixture fills every new field at its 32-bit maximum and the report still fits the 2048-byte panic buffer. No build, flash or boot was performed. The earlier attempt-2 transcript predates the fields and remains ambiguous between the three causes; F3 remains unproven and any device step still needs explicit owner approval.", "The 2026-11-02 Stage-B1R2 diagnostic re-run used a new image built from clean 24f8c9d (kernel 346ff1e0, payload 37ff0a62 contract 7/7, boot image e6d9d402 gate 18/18 against the ce4d76e8 v5 baseline), flashed BOOT only (pre p69 1c64333a, post p69 ac356ef1, image bytes e6d9d402, tail a28b4ea2, RECOVERY 14e11370/EFS 51fa824c/sec_efs 3a265d58 unchanged; pulled gates 18/18 and 7/7). The owner booted it five times without reflashing, all as power+volume-down warm resets with no full shutdown. Two boots reached B1 and produced an identical tuple: rc=-19 stop=1, the BW=1 baseline es=000009cb b0=62084b66 b1=84d0543e same=1, and BW=4 att=1 req=4 sw=0 swrc=-19 tt=0 hc=00 hb=00 ha=02 c6=00000900 es=000009cb with zero-initialized content fields; no 8-bit attempt, CMD19/CMD14 or per-width content pass ran, and the FAIL record is all zero. The clean CMD6 R1 (TRAN + READY_FOR_DATA), the set-and-read-back host width bit and the successful EXT_CSD read returning the 1-bit content (byte 183 = 0; a switched card would read 000009cc) match the plan decision table's card-ignored/stale-readback row and exclude, for these boots, an empty readback and a lost HOST_CONTROL register write; the pad/DLL pre/post samples are identical. The report cannot observe the pad-level width, so a card-side no-op and a data path that did not apply the width remain indistinguishable. The other three boots stopped before B1: block-1 CMD17 -11 (step=15, fail 1/17/1/0x113a/0/0x0002/0x03f800f0/15), array LBA 2 CMD17 -11 (step=16, the same TC-only/no-error sample) and the H8 CMD3-completion timeout (-7, step=9, c3l 100,000 iterations). The TC-only/no-error signature still has no field-for-field simulator case, and pre-B1 flakiness remains (3 of 5 boots). F3 is not established; no code change follows, and the warm-reboot-only method leaves a retained card state open. Host checks are unchanged at core 136/80 and probe 57/34.", "The 2026-11-02 Stage-B1R2 cold session booted the same flashed image (kernel 346ff1e0, payload 37ff0a62, boot image e6d9d402) three times without reflashing, each boot a full power-down then power-on. Cold boot 1 stopped before B1 at the block-1 CMD17 with rc=-11, step=15 and the TC-only/no-error sample 1/17/1/0000113a/0000/0002/03f800f0/15; cold boots 2 and 3 reached B1 and reproduced the 4-bit stop byte-for-byte (c6=00000900, hb=00, ha=02, es=000009cb, sw=0, swrc=-19, BW=8 att=0, FAIL all zero), differing only in the stack free counter (pages identical). A same-session read-only TWRP sha256sum of /dev/block/mmcblk0p69 returned ac356ef1, matching the flash record's post-flash hash, so partition_verified_again_after_boot is true and all eight boots (five warm, three cold) are bound to the flashed bytes; the three cold transcripts and the p69 readout are saved in out/gta4l/ram-root-emmc-probe-b1r2-evidence/ with their hashes in hardware-run-record.json. The 4-bit stop is therefore 4/4 across warm and cold boots, so a card state retained across warm resets is excluded as its cause, and the pre-B1 TC-only/no-error CMD17 signature is cold-vulnerable too, which makes the two signatures independent. The report still cannot observe the pad-level width, so a card-side no-op and a data path that did not apply the new width remain indistinguishable. The owner approved the ladder plan's option (a) as the next rung (section 3.1.3): a fifth stage gta4l-emmc-probe=5 (B1C) that on exactly this tuple runs the CMD19/CMD14 bus test and the stage-A content pass at 4-bit, re-reads EXT_CSD byte 183, restores the host width and emits one report, with no 8-bit attempt; even a pass+pass outcome does not auto-advance F3, and any device step needs a fresh explicit BOOT-only flash approval. No code change follows from this record; host checks are unchanged at core 136/80 and probe 57/34; F3 remains unproven.", "The 2026-11-02 Stage-B1C host batch implements the ladder plan's option (a) as a fifth probe stage gta4l-emmc-probe=5 without changing the command order, registers, clock or power policy. When the 4-bit switch verification fails with exactly the observed tuple (swrc=-19, sw=0, hb=00, ha=02, c6=00000900, es equal to the 1-bit baseline), the probe re-applies the 4-bit host width, runs one CMD19/CMD14 bus test, repeats the stage-A content pass, re-reads EXT_CSD byte 183 and its byte sum, restores the host width and emits one GTA4L-EMMC B1 REPORT with stop=1; rc is the continuation error when one stops it, otherwise the verification result -19. The BW=4 line gains bc= (1 when the continuation ran) and, for stage 5 only, e183a=/esa=; sw/swrc keep their stage-B1 meanings, hc is the end-of-rung HOST_CONTROL sample, and a continuation hard error stops at that step. No 8-bit attempt follows a continuation. Stage-4 reports are unchanged; stage-5 non-continue reports are the stage-4 fields plus zero e183a/esa. The diagnostic wrapper accepts emmc-probe-5. Host checks: the probe suite is 67 scenarios and 39 mutation controls (57/34 before), adding probe-b1c-success, probe-b1c-pass, probe-b1c-late-commit, probe-b1c-bustest-fail, probe-b1c-content-div, probe-b1c-content-error, probe-b1c-reread-error, probe-b1c-c6-error, probe-b1c-zero-readback and probe-b1c-host-width-stuck plus five mutation controls; the core suite is unchanged at 136/80; the report-width-b1 fixture materializes bc=1/e183a=ffffffff/esa=ffffffff and still fits the 2048-byte panic buffer. No build, flash or boot was performed. F3 remains unproven; the device run needs a fresh explicit BOOT-only flash approval and the byte-183 divergence stays an owner-scoring decision.", "The 2026-11-03 Stage-B1C continuation session used the gta4l-emmc-probe=5 image (boot 370b962f, payload 18f15dd0, kernel 2879f5e3) built from clean 5ad1dd6 and flashed BOOT-only to p69 (pre ac356ef1, post c6a9f8e0; image prefix 370b962f, tail a28b4ea2 unchanged; RECOVERY/EFS/sec_efs unchanged; pulled gates 18/18 and 7/7). The owner booted the same image seven times without reflashing (boots 1 and 4 cold, the rest warm) and supplied every report as text. Two boots (3 and 6, warm) reached the B1C continuation on exactly the pinned 4-bit tuple (bc=1, c6=00000900, hb=00 -> ha=02, es=000009cb, sw=0, swrc=-19); both then timed out in the CMD19 write phase: tt=1 tw=00000000 te=00000000 trc=-11, with CC and BufferWriteReady (normal 0x0011) latched but no TC and no error bit, present state 0x03f801f6, and FAIL 1/19/0/0000133a/0000/0011/03f801f6/18 at :1085. This is the project's first data-write-direction terminal sample; all read samples are 0x03f800f0. The two reports are identical except for the stack pages/free counters, and a full cold power cycle occurred between them, so the write-phase timeout is deterministic conditional on reaching the rung and is not caused by card state retained from an earlier interrupted CMD19; a cold boot itself did not reach B1C. The hard error skipped the content pass and the EXT_CSD byte-183 re-read, so b0/b1/same/div and e183a/esa are placeholders. Both reports again read es=000009cb at the attempted 4-bit width. The other five boots stopped pre-B1 (four byte-identical CMD17 TC-only/no-error block-1 timeouts on boots 1, 4, 5 and 7, and one H8 CMD3 timeout on boot 2). The same-session p69 re-read after boot 3 matched c6a9f8e0, binding boots 1-3; boots 4-7 ran without reflashing per the owner's statement, and the partition was not re-read after them. F3 remains unproven; neither the width-caused nor the independent-first-write model is excluded, and the trc=-20 readback-mismatch class remains unobserved. Evidence: out/gta4l/ram-root-emmc-probe-b1r3-evidence/flash-record.json and out/gta4l/ram-root-emmc-probe-b1c-evidence/ (seven transcripts, b1c-p69-reread.txt, hardware-run-record.json); audit section 2.20 and driver section 5.3.14. The next rung candidate is the 1-bit CMD19/CMD14 bus test (gta4l-emmc-probe=6), which needs a fresh owner approval; no code change was made in this batch.", "The 2026-11-03 Stage-B1C 1-bit discriminator host batch adds gta4l-emmc-probe=6: after the stage-A pass and before the first CMD6 it runs one CMD19/CMD14 round trip at 1-bit, then falls through to the unchanged stage-5 flow only if that test passes. A failed 1-bit test stops the rung with stop=9 and no width switch; this separates a width-caused 4-bit write timeout (1-bit passes) from an independent first-write property (1-bit fails). The core now accepts bits=1 in gta4l_emmc_bus_test(); because the SDHCI PIO buffer is 32-bit the 1-bit form writes a 4-byte block with first byte 0x5A and compares the first returned byte (0xA5), exercising the first two bits of the single line. The BW=1 report line carries tt/tw/te/trc for stage 6 and stays byte-identical for stages 4/5 (all zero). Host checks: core 138 scenarios/83 mutation controls (136/80 before) and probe 71/42 (67/39 before), including 1-bit success, pattern mismatch, wrong width, a 1-bit write-phase timeout matching the observed CC+BufferWriteReady no-TC class, the 1-bit pass plus 4-bit continuation, and mutation controls for the guard, pattern, length, skipped discriminator, failure that continues, and wrong stop code; the report-width-b1 fixture still fits the 2048-byte buffer. The diagnostic wrapper accepts emmc-probe-6. No build, flash or boot was performed; F3 remains unproven.", "The 2026-11-03 Stage-B1C-1 device session used the gta4l-emmc-probe=6 image built from clean 5f57dcb (kernel a20d6269, payload fdaa507d with a 7/7 contract, boot image 90cf074c with an 18/18 gate), flashed BOOT-only to p69 (pre c6a9f8e0, post 1ea626f5, unchanged tail a28b4ea2; RECOVERY 14e11370, EFS 51fa824c and sec_efs 3a265d58 unchanged) and booted thirteen times without reflashing (seven cold, six warm). Both p69 re-reads, after boot 9 and after boot 13, matched the post-flash hash. Two cold boots (1 and 12) reached the 1-bit CMD19/CMD14 discriminator before any CMD6 and both timed out in the CMD19 write phase with the identical terminal class as the 4-bit continuation (tt=1 tw=00000000 te=00000000 trc=-11; CC and BufferWriteReady latched, no TC, no error; present 0x03f801f6; FAIL 1/19/0/0000133a/0000/0011/03f801f6/18 at :1090), with es=000009cb and the same stage-A sums, so the data-write path is broken independent of bus width and the width-caused model is excluded. The other eleven boots stopped pre-B1 (eight H8 CMD3 timeouts and three CMD17 TC-only/no-error timeouts, one of them at the GPT array read LBA 2 - a position not recorded before). trc=-20 remains unobserved, the byte-183 readback paradox is unchanged, and F3 stays [U].", "The 2026-11-03 data-timeout audit host batch adds gta4l-emmc-probe=7: after the stage-A pass and before any CMD6 it reads back CLOCK_CONTROL (0x2C), NORMAL_INT_ENABLE (0x34), ERROR_INT_ENABLE (0x36), NORMAL/ERROR_INT_SIGNAL (0x38/0x3A) and ERROR_INT_STATUS (0x32); forces TOUTVAL [7:3] to zero (the 2^13-cycle minimum, about 20.5 ms at 400 kHz) and reads it back; reads 8 blocks through CMD18+CMD12 (about 83 ms at 1-bit/400 kHz) so a working counter must fire mid-transfer; re-reads block 0 to prove recovery; and repeats the 1-bit CMD19/CMD14 wedge with an optional host bus_test_window_us override of 8 s, which uses a dedicated 800,000-iteration cap while every other poll keeps the universal 100,000-iteration cap. The stage always emits the GTA4L-EMMC DTO REPORT (R1/E1/E1S/Q/E2/PAD/FAIL lines; 518 bytes at device-shaped values) and stops with 0 (E1 latched a DTO and E2 ran), 10 (E1 did not latch a DTO), 11 (recovery read failed, E2 skipped), 12 (armed-value mismatch), 13 (E2 passed) or 14 (unexpected E2 class); no CMD6 and no card-state write is issued. Host checks: probe 75 scenarios/46 mutation controls (71/42 before) with probe-dto-fired, probe-dto-silent, probe-dto-q-fail and probe-dto-e2-pass plus ignored-window, silent-E1, skipped-recovery and wrong-block-count mutations; the fired row proves the extended window via >=700,000 ERROR_INT_STATUS reads and the ignored-window core mutation is rejected. The diagnostic wrapper accepts emmc-probe-7. No build, flash or boot was performed; the device run needs a fresh explicit BOOT-only flash approval and F3 remains [U].", "The 2026-11-03 Stage-B1C-2 device session used the gta4l-emmc-probe=7 image built from clean d158378 (kernel 9d7ae51e, payload b4171d96 with a 7/7 contract, boot image 3cc5f9f1 with an 18/18 gate), flashed BOOT-only to p69 (pre 1ea626f5, post 13f88342; image prefix 3cc5f9f1, unchanged tail a28b4ea2; RECOVERY 14e11370, EFS 51fa824c and sec_efs 3a265d58 unchanged) and booted twelve times without reflashing (boot 1 cold, boots 2-12 warm). The post-batch p69 re-read matched 13f88342. Five boots (1, 3, 8, 9 and 10) reached the DTO stage with field-for-field identical rc=0 stop=12 reports: R1 clk=0007 means CLOCK_CONTROL already carried TOUTVAL [7:3]=0 (the 2^13-cycle minimum) before the forced write, and arm=0005 differs from the expected 0007 only on the read-only INT_STABLE bit 0x0002, so stop=12 is a full-register-compare probe artifact, not a device datapoint; E1 and Q run before that gate, so only E2 was skipped. E1 rc=-11 is the software 1 s window, not a controller timeout: fail=1/18/2/0000123a/0000/0021/03f80af6/22 has error=0x0000 (no error bit of any kind, DTO included) and normal=0x0021 (CC and BufferReadReady) with mb=7 blocks streamed (about 3x the 20.5 ms minimum) before the 5 s drain expired unresolved (dr=1/0/0/50000); CMD12 then got no R1b (sr=-7/1/1) and the block-0 recovery read ended in ERR_INHIBIT (Q rc=-17, terminal normal=0x0000). The controller therefore never raises data-timeout in this configuration even on an active healthy transfer, the row-level fact covering every hang row including the pre-B1 CMD17 TC-only class; E2 is moot in the silent branch, so no bus-test datapoint was added. The other seven boots stopped pre-B1: six block-1 CMD17 TC-only/no-error timeouts (rc=-11 fail=1/17/1/0000113a/0000/0002/03f800f0/15) and one post-CMD7 CMD13 completion timeout (stage=7 rc=-7 fail=1/13/65536/00000d1a/0000/0000/03f800f0/12). F3 stays [U], trc=-20 remains unobserved and the byte-183 readback paradox is unchanged. A future probe touch should compare only the TOUTVAL bits in the arming gate; the INT_STABLE drop after a full CLOCK_CONTROL write is a recorded hardware quirk. No code change was made in this records batch; the next rung is B2 (high-speed timing) pending owner approval.", "The 2026-11-03 Stage-B2 HS-timing host batch adds gta4l-emmc-probe=8: after the stage-A pass and before any width CMD6 it samples byte 185 (HS_TIMING), CLOCK_CONTROL and the pad/DLL state; sends CMD6 SET index 185 value 1, waits TRAN/ready, reads byte 185 back and, only on a confirmed hs=1, ramps the GCC SDCC1 APPS RCG to the pinned 50 MHz floor row (CFG 0x20B, source select 2, divider 11, M/N/D 0; the 52 MHz class floors to 50 MHz because the pinned gcc-sm6115 table has no 52 MHz entry and clk_rcg2_floor_ops selects F(50000000, P_GPLL0_OUT_AUX2, 6, 0, 0)); repeats the full stage-A content pass at 50 MHz and compares every sum with the 400 kHz baseline; then drops the clock to 400 kHz first, clears byte 185, reads both back and re-reads block 0. The rung always emits GTA4L-EMMC B2 REPORT and stops with 0 (pass), 10 (switch/byte-185 failure or pre-switch read failure), 11 (RCG/INT_STABLE/clock failure), 12 (content read failure or first divergence), 13 (revert failure) or 14 (recovery-read failure); it issues no CMD19/CMD14, no width switch and no user-data write, and the only card write is byte 185. Host checks: core 143 scenarios/86 mutation controls (was 138/83) with HS enter/leave, ignored byte-185 readback, CMD6 SWITCH_ERROR and busy-RCG cases plus three mutations; probe 85 scenarios/51 mutation controls (was 75/46) with the B2 pass, ignored switch, busy RCG, content divergence, content read error, failed revert, failed recovery read and failed pre-read scenarios plus four mutations; a sixth report-width materialization (report-width-b2) bounds the widest fields inside 2048 bytes; the diagnostic wrapper and payload gate accept emmc-probe-8. The stage-7 arming gate now compares only the TOUTVAL bits (with a new probe-dto-arm-ro scenario), so the read-only INT_STABLE drop cannot block a DTO report. No build, flash or boot was performed; the device run needs a fresh explicit BOOT-only approval and F4 remains [U].", "The 2026-11-03 Stage-B2 HS-timing device session used the gta4l-emmc-probe=8 image built from 9a84215 plus the packager fix 9d6fd1f (kernel fc3d5ee3, payload 9d17d0a1 with a 7/7 contract, boot image e5bc5024 with an 18/18 gate against the ce4d76e8 v5 baseline), flashed BOOT-only to p69 (pre 13f88342, post 2cd82e0f; image prefix e5bc5024, unchanged tail a28b4ea2; RECOVERY 14e11370, EFS 51fa824c and sec_efs 3a265d58 unchanged; pulled gates 18/18 and 7/7) and booted four times without reflashing (boot 1 cold, boots 2-4 warm). The post-batch p69 re-read matched 2cd82e0f. Boots 2 and 4 produced field-for-field identical rc=0 stop=0 B2 reports (only the stack counters differ; boot 4's owner-supplied PAD post field carried an extra leading zero, 000009fe4 instead of 00009fe4): R clk=0007 hs=00 es=000009cb; S rc=0 sw=0 c6=00000900 hs=01 clk=0007 rcg=0000020b sum=000009cc; T rc=0 att=1 same=1 div=0 b0=62084b66 b1=84d0543e data=f418cd33 last=a89b26d5 with all 21 GPT-array block sums matching the 400 kHz baseline; V rc=0 sw=0 hs=00 clk=0007 rcg=00002017 q=0 qb0=62084b66; FAIL all zero. The card accepted EXT_CSD HS_TIMING byte 185, the controller programmed and read back the pinned 50 MHz floor row (0x20B; the 52 MHz class floors to 50 MHz), the full stage-A content pass matched at that clock, and the revert to legacy timing plus the block-0 recovery read were clean. F4 is measured PASS at 1-bit/50 MHz (content-level only; not a width, write, DMA, CQE, ICE, HS200 or frequency-measurement result), and the two matching reports satisfy the two-matching rule. Boots 1 and 3 stopped pre-B2 with the known H8 CMD3-completion timeout (stage=8 rc=-7 fail=1/3/65536/0000031a/0000/0000/03f800f0/9, step=9, log=5/8/3/0), so the cold-start path is not part of the F4 evidence and both passes are warm boots that followed a pre-B2 stop. F3 remains unproven: the rung did no width work, trc=-20 remains unobserved and the byte-183 readback paradox is unchanged. Evidence: out/gta4l/ram-root-emmc-probe-b2-evidence/ (build-provenance.json, flash-record.json, device-run-transcript.txt, postbatch-hashes.txt).", "The 2026-11-03 Stage-H9 host batch adds gta4l-emmc-probe=9, the identification-stage CMD3-completion retry discriminator for the H8 class. The stage runs the standard read-only identification sequence exactly once, preserving the pinned 8-us post-ready CMD1 delay, and adds one designed hook: if CMD3 ends in GTA4L_EMMC_ERR_CMD_TIMEOUT (the H8 record, stage=n rc=-7 fail=1/3/65536/0000031a/0000/0000/03f800f0/9 step=9), the core snapshots attempt 1 and re-issues exactly one CMD3 with the identical argument 0x00010000 and timing path, never a third attempt and with no fall-through; the stage stops after the TRAN wait, before any EXT_CSD read and before the stage-A pass, so it issues no CMD6, no width switch and no user-data access, and the only new card-facing action is the duplicate CMD3. The core keeps the hook opt-in (cmd3_retry_enabled) and the probe sets it only for stage 9; a second opt-in identify_only stops gta4l_emmc_init() after wait_tran(). Each attempt is folded into a two-slot capture (result, R1 error flag, live fail record, pre-CMD3 and timeout samples and poll history), and attempt 1 is copied before the live failure state is cleared for the duplicate. The stage always emits GTA4L-EMMC H9 REPORT (header rc/stop/retry=engaged/ok/att/step/log; A1/A2 attempt lines; A1P/A2P pre-command and timeout samples; A1L/A2L poll histories; C CID/CMD1 line; terminal H9 FAIL line) and stops with 0 (clean identification, no retry), 10 (retry engaged, duplicate clean, identification clean), 11 (duplicate transport failure), 12 (duplicate clean, later identification failure), 13 (duplicate R1 status error), 14 (no retry and no clean identification) or 15 (attempt-1 clean, later identification failure). Host checks: core 148 scenarios/90 mutation controls (was 143/86), adding cmd3-retry-clean/pass/fail/status/later-fail plus silent-retry, retry-without-first-timeout, changed-argument and unbounded-retry mutations; probe 91 scenarios/51 mutation controls (was 85/51), adding probe-h9-clean-no-fire, probe-h9-fire-pass, probe-h9-fire-fail, probe-h9-fire-second-ident and probe-h9-mismatch plus a seventh report-width materialization (report-width-h9); the diagnostic wrapper and payload gate accept emmc-probe-9. No build, flash or boot was performed; the device run needs a fresh explicit BOOT-only approval that names the duplicate CMD3, and F3 remains [U].", "The 2026-11-03 Stage-H9 CMD3-completion retry device session used the gta4l-emmc-probe=9 image built from clean a952a09 (kernel 75e529a3, payload e1b474f7 with a 7/7 contract, boot image 92d9471c with an 18/18 gate against the ce4d76e8 v5 baseline; probe archive 7022e326 matches the committed sources), flashed BOOT-only to p69 (pre 2cd82e0f, post 25385fd7; image prefix 92d9471c, unchanged tail a28b4ea2; RECOVERY 14e11370, EFS 51fa824c and sec_efs 3a265d58 unchanged; pulled gates 18/18 and 7/7) and booted four times without reflashing (boot 1 cold, boots 2-4 warm). The post-batch p69 re-read matched 25385fd7, binding all four boots. Boots 1/3/4 produced field-identical rc=-7 stop=11 reports (retry=1/0 att=2 step=9): attempt 1 reproduced the historical H8 tuple fail=1/3/65536/0000031a/0000/0000/03f800f0/9 and exhausted the full 100,000-iteration 10 us poll budget (about 1.14 s at the 19.2 MHz counter) with first/last normal zero at every step and a zero fresh post-timeout sample, so the wait is completion-silent and the 65536 field is the FAIL-record argument (0x00010000), not a latched CTO bit. The approved duplicate CMD3 with the identical argument 0x00010000 also timed out in all three boots (0/3 recovery) and exited through the latched-error branch with fail=1/3/65536/0000031a/0001/8000/03f800f1/9 (ERROR 0x0001 command timeout, NORMAL 0x8000 error summary, present-state bit 0 newly set), field-identical across the three boots; the zero A2L poll capture is that exit path's expected shape because the mid-loop error branch never validates it. Boot 2 was the clean control (rc=0 stop=0 retry=0/0 att=1 step=13 rca=1): a clean CMD3 completed within 26 poll iterations (0x1560 ticks, about 0.29 ms) and the attempt-2 slot stayed empty (n=0). The decision table's sticky row is taken with three field-identical samples (the two-matching rule closed at boots 1 and 3; boot 4 is a third sample), the majority row was exercised once, and the attempt-1-timeout/attempt-2-clean row never occurred, so no per-boot duplicate-CMD3 retry policy is adopted; the flake remains per-boot random (cold 1 timeout, warm 2 clean, warm 3/4 timeout; 3 of 4 boots this batch versus 2 of 4 in the B2 batch) and future rungs treat a completion-timeout stop as an invalid boot to re-run. The terminal H9 FAIL line prints on every stop and is zeroed on the clean boot. F3 remains [U], trc=-20 remains unobserved and the byte-183 readback paradox is unchanged. Evidence: out/gta4l/ram-root-emmc-probe-h9-evidence/ (build-provenance.json, flash-record.json, flash-commands.log, device-run-transcript.txt, postbatch-hashes.txt, pulled gate reports).", "The 2026-11-03 Stage-H10 width-at-HS continuation host batch adds gta4l-emmc-probe=10: the standard read-only identification once (no CMD3 retry), the unchanged stage-A content pass at 400 kHz/1-bit as the baseline, then HS entry (byte 185 = 1, RCG 0x20B), a 4-bit BUS_WIDTH switch at HS (byte 183 = 1, CMD13 TRAN wait, HOST_CONTROL write/readback, EXT_CSD re-read at the attempted width), one CMD19/CMD14 round trip at 4-bit, the full content pass at 4-bit/HS, the width revert (byte 183 = 0), the HS revert (clock to 400 kHz first, then byte 185 = 0) and a block-0 recovery read. It always emits GTA4L-EMMC H10 REPORT and stops with 0/10/11/12/13/14/15/16/17; there is no 8-bit step, no on-device retry and no fall-through, and the only card writes are bytes 185/183 plus the 4-byte CMD19 pattern (no CMD18/CMD25, no user-data write). The stage reuses the opt-in gta4l_emmc_set_hs_timing(), gta4l_emmc_set_bus_width() and gta4l_emmc_bus_test() calls and the shared content/compare helpers, and the stage parser accepts 1..10. The report carries the header (rc/stop/identification fields/hci/step/log/bw), an R identity line, S (HS entry), W (width switch), B (bus test), T (content), V (width revert), X (HS revert) and Q (recovery) lines, the shared BLOCKS/PAD lines and the terminal FAIL record. Host checks: the probe suite is 102 scenarios and 56 mutation controls (was 91/51), adding probe-h10-pass, probe-h10-hs-ignored, probe-h10-clock-busy, probe-h10-width-ignored, probe-h10-bustest-timeout, probe-h10-bustest-mismatch, probe-h10-content-div, probe-h10-content-read, probe-h10-width-revert-fail, probe-h10-hs-revert-fail and probe-h10-q-fail plus five mutation controls (skipped width step, wrong stop code, silent width revert, skipped content pass and a bus-test failure that continues into the inhibited controller). The core suite is unchanged at 148/90. The report-width-h10 fixture is the eighth width materialization, and the diagnostic wrapper and payload gate accept emmc-probe-10. Device-run result (2026-11-03): flashed BOOT only (p69 25385fd7... -> 38c74815..., post-batch re-read matched, no reflash) and booted 15 times (12-boot batch plus an owner-approved 3-boot extension; two cold starts, boots 1 and 6). Boot 2 was the only H10 verdict: rc=-19 stop=12 with the legacy width tuple at HS (c6=00000900, hb=00 to ha=02, sw=0 swrc=-19, es equal to the 1-bit-at-HS sum 0x9cc), clean V/X reverts and zero-initialized not-run B/T/Q fields (log=33 matching the committed failure path). The other fourteen boots were pre-HS CMD3 completion-silent stops (PROBE FAILED rc=-7, step 9), including both cold boots, so they are re-run not retried. The timing-class model for the BUS_WIDTH refusal is therefore excluded; the verdict carries the single-sample caveat (N=1, two-matching rule unmet, 15-boot cap reached). The CMD19-at-4-bit/HS question stays unmeasured and F3 remains [U].", "The 2026-11-03 Stage-H11 width-value continuation host batch adds gta4l-emmc-probe=11: the standard read-only identification once (no CMD3 retry), the unchanged stage-A content pass at 400 kHz/1-bit as the baseline, then HS entry exactly as H10 (byte 185 = 1, RCG 0x20B, readbacks), the record-only W4 replay of the H10 4-bit switch at HS (byte 183 = 1, CMD13 TRAN wait, HOST_CONTROL write/readback, byte-183 readback, EXT_CSD re-read), the W8 8-bit attempt at HS (byte 183 = 2, still SDR; no bit-4/DDR variant), one CMD19/CMD14 round trip and the full content pass at 8-bit/HS only when the W8 switch is honored, the width revert (byte 183 = 0), the HS revert (clock to 400 kHz first, then byte 185 = 0) and a block-0 recovery read. It always emits GTA4L-EMMC H11 REPORT (R/S/W4/W8/B/T/V/X/Q lines plus the shared BLOCKS/PAD and terminal FAIL record) and stops with 0/10/11/12/13/14/15/16/17/18: 12 is the W8 switch failure (CMD6/R1 error, empty readback or byte-183 readback mismatch), 18 is the W4 anomaly that stops before W8, and a W4 clean-shape match or mismatch never stops the rung (a match is the second sample closing the H10 N=1 caveat; a mismatch re-opens H10 as per-boot random). A W8 readback that disagrees with its own re-read sum is the byte-183 paradox row and stops after the reverts with no B/T on the unproven framing. The only card writes are bytes 185/183 plus the 8-byte CMD19 pattern at the honored 8-bit width (no CMD18/CMD25, no user-data write, no DDR value), and the stage parser accepts 1..11. Host checks: the probe suite is 116 scenarios and 64 mutation controls (was 102/56), adding probe-h11-honored-pass, probe-h11-w4-replay, probe-h11-w4-mismatch, probe-h11-w8-div, probe-h11-w8-err, probe-h11-w4-anomaly, probe-h11-clock-busy, probe-h11-bustest-timeout, probe-h11-bustest-mismatch, probe-h11-content-read, probe-h11-content-div, probe-h11-width-revert-fail, probe-h11-hs-revert-fail and probe-h11-q-fail plus eight mutation controls (skipped W4 step, skipped W8 step, bus test at the wrong width, silent revert, wrong W8 stop code, skipped content pass, host width not restored and a must-refuse byte-183 DDR scope control). The core suite is unchanged at 148/90. The report-width-h11 fixture is the ninth width materialization, and the diagnostic wrapper and payload gate accept emmc-probe-11. Device-run result (2026-11-03): flashed BOOT only (p69 38c74815... -> 2f6deba3..., image prefix 3dc561cd..., unchanged tail a28b4ea2...; RECOVERY 14e11370, EFS 51fa824c and sec_efs 3a265d58 unchanged) and booted five times without reflashing by the owner; the per-boot cold/warm method was not captured; the post-boot p69 re-read matched 2f6deba3... (battery 100% Full), binding every boot. Boots 1-4 were pre-identification CMD3 completion-silent stops (PROBE FAILED stage=11 rc=-7, step=9, the historical H8 tuple and 100,000-iteration poll window): facts only, re-run not retried. Boot 5 was the only H11 verdict: rc=-19 stop=12, matching the committed probe-h11-w4-replay fingerprint field-for-field. W4 replayed the H10 4-bit switch at HS and returned the legacy tuple (c6=00000900, hb=00 -> ha=02, sw=0 swrc=-19, es equal to the 1-bit-at-HS sum 0x9cc), the second matching sample that closes the H10 N=1 caveat. W8 (byte 183 = 2) was ignored with the same legacy tuple despite the host applying the 8-bit code (ha=20), so the byte-183 refusal is sticky, timing-class-independent and covers both nonzero SDR values tried - the whole-SDR-field refusal row is closed. The V/X reverts were clean, PAD pre equals post, and B/T/Q are the zero-initialized not-run records (log=33). F3 remains [U]; the open owner questions are the DDR bit-plane and the CMD19 write-phase wedge. Evidence: out/gta4l/ram-root-emmc-probe-h11-evidence/ (flash-record.json, device-run-record.json, device-run-transcript.txt, postflash-hashes.txt).", "The 2026-11-03 Stage-H12 record-only DDR attempt host batch adds gta4l-emmc-probe=12: the standard read-only identification once (no CMD3 retry), the unchanged stage-A content pass at 400 kHz/1-bit as the baseline, HS entry exactly as H10/H11 (byte 185 = 1, RCG 0x20B, readbacks), one record-only CMD6 SET of EXT_CSD byte 183 to 4 (the JEDEC 4-bit DDR code, bit 2 set over SDR value 1), its CMD13 TRAN wait, the matching 4-bit SDR HOST_CONTROL DAT width for the verification read, the byte-183 readback and a fresh EXT_CSD re-read with its byte sum, the width revert (byte 183 = 0 at HS), the HS revert (clock to 400 kHz first, then byte 185 = 0) and a block-0 recovery read. It always emits GTA4L-EMMC H12 REPORT (R/S/WDDR/VR/X/Q lines plus the shared PAD and terminal FAIL record) and stops with 0/10/11/12/13/14/15: 0 is the clean refusal (readback 0 and the re-read sum equal to the 1-bit-at-HS sum), 13 is the honored row (readback 4 or a sum that grew by exactly 4) stopped before any controller DDR work, and 12 is the verification failure (transport/R1 error, empty read or a readback that disagrees with its own sum). The controller DDR configuration (CORE_DDR_CONFIG and the HOST_CONTROL2 MCLK_SEL/HC_SELECT_IN fields) is never touched; the only card-state writes are bytes 185/183 and no CMD19/CMD14, CMD18/CMD25, value-5, HS200/HS400 or user-data write is issued. The stage reuses gta4l_emmc_set_hs_timing(), gta4l_emmc_set_bus_width() and the shared helpers, and adds gta4l_emmc_set_bus_width_ddr() (raw value 4) in the portable core; the stage parser accepts 1..12. Host checks: the probe suite is 128 scenarios and 69 mutation controls (was 116/64), adding probe-h12-refused-pass, probe-h12-honored, probe-h12-wddr-err, probe-h12-wddr-paradox, probe-h12-wddr-empty, probe-h12-hs-ignored, probe-h12-clock-busy, probe-h12-width-revert-fail, probe-h12-hs-revert-fail, probe-h12-q-fail and probe-h12-pre-read-fail plus five mutation controls (skipped WDDR step, wrong stop code, silent width revert, skipped recovery read and a wrong DDR code that issues value 5); the existing h11-width-ddr core mutation now rejects any DDR value from stages 1..11. The core suite is unchanged at 148/90. The report-width-h12 fixture is the tenth width materialization, and the diagnostic wrapper and payload gate accept emmc-probe-12. No build, flash or boot had been performed when the host batch landed. The device run followed on 2026-11-03: the stage-12 image was built from clean dc1a85a (kernel 75a4661a..., payload 27d8228f... with a 7/7 contract, boot image e5744884... with an 18/18 gate against the ce4d76e8... v5 baseline), flashed BOOT only (p69 2f6deba3... -> 0f7ec22c..., image prefix e5744884..., unchanged tail a28b4ea2...; RECOVERY/EFS/sec_efs unchanged) and booted five times without reflashing by the owner; the per-boot cold/warm method was not captured; the post-boot p69 re-read matched 0f7ec22c... (battery 97%), binding every boot. Boots 1, 2 and 4 were pre-identification CMD3 completion-silent stops (PROBE FAILED stage=12 rc=-7, step=9, the historical H8 tuple and 100,000-iteration poll window) and boot 3 was a block-1 CMD17 data timeout (rc=-11, step=15, TC only, no error): facts only, re-run not retried. Boot 5 was the only H12 verdict: rc=-15 stop=12. The record-only byte-183 = 4 CMD6 answered clean (c6=00000900) but the 4-bit SDR verification re-read failed with card status (sw=0, swrc=-15, es=00000000); no byte-183 = 4 readback was obtained. The V/X reverts and Q recovery read were clean, PAD pre equals post, and log=33. This is not the clean-refusal fingerprint (swrc=-19, es=0x9cc) and not the honored row (sw=4, es=0x9cd), so the byte-183 paradox row is measured but unverified and the whole-field-refusal conclusion remains open. F3 remains [U]; the open owner questions are the DDR bit-plane and the CMD19 write-phase wedge. Evidence: out/gta4l/ram-root-emmc-probe-h12-evidence/ (flash-record.json, device-run-record.json, device-run-transcript.txt, postflash-hashes.txt, postboot-reread.txt).", "The 2026-11-03 host-only write-phase wedge audit (docs/emmc-write-wedge-audit.md, docs/emmc-driver.md section 5.3.27, docs/emmc-cmd2-crc-audit.md section 2.30) dissects the recorded CMD19 write-phase wedge. At both the B1C 4-bit continuations and the B1C-1 1-bit cold discriminator the command phase completes (CC latched, R1 response read), the controller requests the block (BufferWriteReady latched), and the data phase never latches TC with no error bit; the terminal tuple is error=0x0000, normal=0x0011 and present 0x03f801f6 (DAT_INHIBIT and DAT_LINE_ACTIVE set). Against the pinned sdhci.c PIO/transfer-mode path, the sdhci-msm timeout formula, JEDEC B1.51 section 6.6.4/Table 7 and section A.6.3/Table A.223 and Linux mmc_bus_test(), the leading cause is that CMD19 is a host-to-device bus-test pattern for which the card sends no CRC status token, so the controller waits for a completion that never arrives; the port's TIMEOUT_CONTROL = 0x0E is about 22 minutes at 400 kHz, far beyond the 1 s window every observed wedge used, and the 8 s E2 repeat never ran because the stage-7 E1 recovery read failed with ERR_INHIBIT. The audit also records the missing per-request data-circuit reset as a host recovery gap (not the first-wedge cause) and names a data-reset + CMD14 rung as the recommended owner-gated follow-up, with a forced-TOUTVAL=0 1-bit write second. No build, flash, boot or device access was performed, no card-state write or write-side verdict was added, F3 remains [U], and the next device step needs a fresh explicit BOOT-only approval.", "The 2026-11-03 Stage-H13 rung-1 write-phase recovery host batch adds gta4l-emmc-probe=13, the first rung of the host-only wedge audit's ladder: the standard read-only identification once (no CMD3 retry), the unchanged stage-A content pass at 400 kHz/1-bit as the baseline, one record-only 1-bit CMD19 write, one bounded SDHCI data-circuit reset (SOFTWARE_RESET data bit 0x04 with the 100,000 us self-clear poll at the 10 us step), the post-reset PRESENT_STATE/DAT_INHIBIT sample, one CMD14 read with the existing pattern comparison, the block-0 recovery read and the GTA4L-EMMC H13 REPORT; it issues no CMD6, CMD18, CMD25 or user-data write and changes no card width or timing. Stop codes are 0 (wedge + reset clear + CMD14 expected), 10 (reset not self-clearing), 11 (DAT_INHIBIT survives), 12 (width/argument precondition), 13 (CMD14 pattern mismatch), 14 (CMD14 transport/card-status), 15 (recovery read failed or disagreed), 16 (write completed normally) and 17 (non-timeout write error). Host checks: probe 139 scenarios/69 mutation controls (was 128/69) with ten probe-h13-* rows plus report-width-h13 (the eleventh width materialization); core 160/98 (was 148/90); the diagnostic wrapper and payload gate accept emmc-probe-13. The device run followed on 2026-11-03: the image was built from clean 5c79aa9 (kernel 3e02d187, payload 1fb04a4d with a 7/7 contract, boot image bc8175e9 with an 18/18 gate against the ce4d76e8 v5 baseline; probe archive 4ffb6d2c matches the committed sources), flashed BOOT only (p69 0f7ec22c -> 18d2a83d, image prefix bc8175e9, unchanged tail a28b4ea2; RECOVERY/EFS/sec_efs unchanged) and booted repeatedly without reflashing; the exact count was lost and the verdict arrived on an estimated ~18th boot. The post-boot p69 re-read matched 18d2a83d (battery 92%), binding every boot. About seventeen boots were pre-identification CMD3 completion-silent stops (PROBE FAILED stage=13 rc=-7, step=9, fail=1/3/65536/0000031a/0000/0000/03f800f0/9, the historical tuple and 100,000-iteration poll window; facts only, re-run not retried). The verdict boot was rc=-12 stop=14: the CMD19 write reproduced the wedge (wrc=-11, err=0000, nrm=0011, pst=03f801f6; terminal tuple 1/19/0/0000133a/0000/0011/03f801f6/18 field-identical to the B1C/B1C-1 rows), the bounded reset self-cleared (rc=0 wr=04 rb=00 it=6 pst=03f800f0 dinh=0), CMD14 failed with ERR_DATA_CRC (trc=-12, tw/te unset) and the block-0 recovery read was refused with ERR_INHIBIT (Q rc=-17, qb0 unset); PAD pre equals post and log=31. The reset clears the controller latch but does not restore the card's data conversation, consistent with a card still waiting for the write data phase; the card remained readable at the partition level in TWRP after the batch. The verdict is a single sample (two-matching rule unmet), F3 remains [U], and the next rung is the forced post-write CMD12/CMD13 drain command sample, to be drafted only after this record lands. Evidence: out/gta4l/ram-root-emmc-probe-h13-evidence/ (flash-record.json, device-run-record.json, device-run-transcript.txt, postflash-hashes.txt, postboot-reread.txt).", "The 2026-11-04 Stage-H14 rung-2 forced post-write CMD12/CMD13 drain host batch adds gta4l-emmc-probe=14: the stage-13 form (standard read-only identification once, the stage-A pass at 400 kHz/1-bit, one record-only 1-bit CMD19 write, one bounded SDHCI data-circuit reset with the self-clear poll, the post-reset PRESENT_STATE/DAT_INHIBIT sample) plus one forced CMD12 STOP_TRANSMISSION (R1b, argument 0, no ACMD12 transfer-mode bit) and, when it completed, one CMD13 SEND_STATUS (R1), inserted between the reset and the record-only CMD14/Q reads because a failed CMD14 re-latches the data inhibit; the stage always emits GTA4L-EMMC H14 REPORT and stops with 0/10/11/12/13/14/15/16/17, issues no CMD6, CMD18, CMD25 or user-data write and changes no card width or timing. The drain is local to gta4l_emmc_post_write_drain(); the CMD12 entry wait applies the SDHCI stop-command DAT_INHIBIT exemption, CMD13 keeps the normal both-inhibit wait, and TIMEOUT_CONTROL is untouched. Probe 151 scenarios/77 mutation controls (was 139/69) with eleven probe-h14-* rows plus the twelfth width materialization report-width-h14; core 168/104 (was 160/98) with eight scenarios and six mutation controls; the diagnostic wrapper and payload gate accept emmc-probe-14. No build, flash or boot was performed; the device run needs a fresh explicit BOOT-only approval naming the CMD19 write, the data reset, the forced CMD12 and CMD13, the CMD14 read and the block-0 recovery read, and F3 remains [U].", "The 2026-11-04 protocol audit withdrew the byte-183 width-refusal, H12 DDR, stage-7 armed-timeout and H13 CMD14-CRC causal claims and fixed the underlying code. JESD84-B51 7.4 Table 93 defines BUS_WIDTH[183] as W/E_P, not readable, so a zero readback is not evidence of refusal; Linux mmc_select_bus_width() uses a bus test or read-only EXT_CSD comparison. gta4l_emmc_set_bus_width_verified() now compares the read-only properties segment (bytes 192..511), restores the host and the card on failure and returns GTA4L_EMMC_ERR_WIDTH_RESTORE when the framing cannot be proven; the legacy byte-183 path remains only for already-flashed stages. H12 used reserved value 4, not DDR (5/6), and the helper is renamed set_bus_width_reserved4. CMD14 bus-test reads tolerate one optional pattern-CRC indication (JEDEC 6.6.4; Linux sdhci_data_irq() exempts MMC_BUS_TEST_R) while normal reads keep CRC fatal. The 1-bit bus test uses the JEDEC 0x80 transmit pattern and the two-bit check. The stage-7 audit now writes TIMEOUT_CONTROL 0x2E and reports toc/arm/restored, not CLOCK_CONTROL bits. CMD18 checks live PRESENT_STATE buffer readiness and acknowledges BRR after each sector; both simulators model readiness separately from the latched bit. H14 is paused because CMD12 is not appropriate for the single-block CMD19 write. H15 (gta4l-emmc-probe=15) is the corrected verified 4-bit SDR rung, host-tested only; no device run exists. Core 172/104 and probe 154/77; raw reports and images are preserved.", "The 2026-11-05 Stage-H15 cold boot passed the verified 4-bit SDR switch (CMD6 status 0x00000900, HOST_CONTROL 00->02, read-only EXT_CSD properties matched, es=0x000009cb) and then reproduced the CMD19 write-phase timeout at 4-bit (rc=-11, err=0, nrm=0x11, PRESENT_STATE 0x03f801f6), so the wedge is not width-specific. The old H15 revert called the verified switch, whose pre-switch EXT_CSD read was blocked by the latched DAT_INHIBIT (-17), so no CMD6 was issued and the host stayed at 4-bit; the content pass and Q did not run, and the old report printed T att=1 and a default Q rc=0. The corrective batch adds explicit att flags and a T result code, gta4l_emmc_set_bus_width_recover() (healthy-path baseline, bounded data reset before CMD6, read-only properties verification), and the content-only H16 stage gta4l-emmc-probe=16 with no CMD19/CMD14. H15/H16 stop codes are 0/10/11/12/13/14/15/16. Core 176/104 and probe 158/77; no new image was built or flashed for this record, H14 remains paused and F3 remains [U].", "The 2026-11-05 Stage-H16 content-only device run returned rc=0 stop=0 on its first boot (owner warm reboot from TWRP; BOOT-only image 4f1bfb90, payload 7404870a with a 7/7 contract, gate 18/18, commit 20c9f9a). The verified 4-bit SDR switch passed on the first CMD6 attempt (c6=00000900, hb=00 ha=02, vf=1, es=000009cb), the full 4-bit content pass matched the 1-bit baseline (T att=1 rc=0 same=1 div=0, b0=62084b66 b1=84d0543e data=f418cd33 last=a89b26d5), the baseline-based width recovery worked on hardware (V att=1 rc=0 c6at=1 c6=00000900 hb=02 ha=00 vf=1) and the block-0 recovery read matched T b0 (Q att=1 rc=0 qb0=62084b66); B att=0 records that no CMD19/CMD14 was attempted, fail=0 and the PAD samples are unchanged. The W line read BUS_WIDTH back as 0 where the H15 boot read 1, so byte 183 is not a usable switch indicator in either direction. 4-bit SDR sector reads are therefore measured [C] at 400 kHz and the write wedge is not a width-caused data-path failure. F3 remains [U]: only the CMD19/CMD14 round trip is outstanding, and the recorded write timeout is now read as the Linux/TI completion rule (mmc_bus_test() ignores BUS_TEST_W errors; TI SPRZ436H i836 expects the data timeout and proceeds to CMD14) rather than a card or datapath verdict. Raw evidence stays outside the tracked tree at out/gta4l/ram-root-emmc-probe-h16-evidence/ (device-run-transcript.txt, device-run-record.json, flash-record.json); docs/emmc-driver.md section 5.3.32.", "The 2026-11-05 Stage-H17 host batch applies the reference bus-test completion rule the recorded CMD19 wedge actually calls for. Linux mmc_bus_test() discards every BUS_TEST_W error and lets BUS_TEST_R decide (and returns 0 for a 1-bit bus), sdhci_data_irq() exempts MMC_BUS_TEST_R from the data-CRC path and sdhci resets the data circuit on the data error, JEDEC 6.6.4 defines CMD19 as a pattern with no CRC status token, and TI erratum SPRZ436H i836 records the resulting controller data timeout with the guideline to clear it and continue to CMD14. The core gains an opt-in bus_test_tolerate_write_timeout flag plus write_result/reset_result fields: only a CMD19 DATA_TIMEOUT is tolerated, the data circuit is cleared with one bounded local reset, and any other write error or a reset that cannot prove the circuit idle still stops. Stage 17 (gta4l-emmc-probe=17) runs the baseline, the verified 4-bit switch, the full 4-bit content pass, one CMD19 4-byte pattern write with the tolerated timeout, the data reset, one CMD14 read-back, the verified revert and the block-0 recovery read; it emits GTA4L-EMMC H17 REPORT with stop 0/10/11/12/13/14/15/16 and adds wrc/rst/ci to the shared H15/H16/H17 B line. Host checks: core 179/104 (was 176/104) with bus-test-tolerate-timeout, bus-test-tolerate-inhibit and bus-test-tolerate-write-crc, and probe 163/77 (was 158/77) with probe-h17-pass, probe-h17-content-div, probe-h17-pattern-mismatch, probe-h17-write-crc and probe-h17-inhibit; the H15 strict path keeps its recorded wrc=-11 trc=-11 behaviour. No build, flash or boot was performed; the device run needs a fresh explicit BOOT-only approval, and F3 remains [U] until the CMD19/CMD14 round trip is measured at 4-bit.", "The 2026-11-05 Stage-H17 device run closes the F3 bus-test clause at 4-bit. The a198db1 image (boot image 13938e49, payload 72f6e2d4 with a 7/7 contract, gate 18/18) was booted four times without reflashing (cold, then three warm); the first three stopped at the known pre-identification CMD3-completion timeout with no report, and the fourth (warm) returned rc=0 stop=0. The verified 4-bit SDR switch passed on the first CMD6 attempt (c6=00000900, host 00->02, vf=1, es=000009cb), the 4-bit content pass matched the 1-bit baseline (same=1 div=0, b0=62084b66 b1=84d0543e data=f418cd33 last=a89b26d5), and the CMD19 write produced the expected no-CRC-status timeout (wrc=4294967285 = -11, fail record bound to CMD19 with CC latched, present 0x03f801f6). The opt-in rule tolerated only that timeout, one bounded data reset cleared the circuit (rst=0), CMD14 returned the expected word (trc=0, tw=te=000000a5) - the first successful CMD19/CMD14 round trip on this device - and the verified revert (02->00), block-0 recovery read (qb0=62084b66) and unchanged PAD samples followed. fail=1 preserves the tolerated timeout by design; rc=0 stop=0 is the verdict. Byte 183 read back 1 here, 0 in H16 and 1 in H15, all on verified live 4-bit paths, so it is not a usable switch indicator in either direction. F3 is therefore measured PASS at 4-bit SDR, 400 kHz [C]; the 8-bit width is untried and remains open, and cold-boot identification reliability is a separate open issue. The report's panic location (Gta41EmmcProbe.c:2775) is the last argument line of the shared report panic in a198db1, binding the report to the flashed source. Two diagnostic carry-forwards are recorded for the next rung: last_step is only advanced to BUS_TEST after the CMD14 read, so the tolerated timeout's failure record reads step 18 (PROBE_LAST); and the tolerated timeout leaves fail_valid=1, so a later failure in the same boot would not be recorded. Raw report and decoded record are outside the tracked tree at out/gta4l/ram-root-emmc-probe-h17-evidence/; docs/emmc-driver.md section 5.3.34.", "The 2026-11-05 Stage-C/F5 storage-publication design survey is recorded in docs/gta4l-storage-publication-design.md; it is host-only and adds no code, build, flash or boot. Key findings: the kernel prelink already carries com.apple.iokit.IOStorageFamily 2.1 with the IOBlockStorageDriver (IOProviderClass IOBlockStorageDevice, device-type Generic), IOGUIDPartitionScheme (whole IOMedia, GUID_partition_scheme content mask) and IOMediaBSDClient (IOMedia, IOResourceMatch IOBSD) personalities, and the APFS kext is prelinked; the public headers are prepared at build/storage-abi/include from revision e45fbe30, though the existing scripts/audit-storage-interface.py qualification artifact is not present in this checkout and must be produced before linking. NativeRamBlock and NativeVirtioBlock are working IOBlockStorageDevice templates (complete override set, synchronous doAsyncReadWrite that completes the request, IOLock serialization, IOResources/IOBSD personality for the RAM transport). The gta4l C core already exposes controller/card init and 512-byte CMD17 reads and has no public user-data write API; the probe maps SDHCI 0x04744000, GCC 0x01438000 and TLMM 0x00575000 through ml_io_map. The shared SM6115 repository has no SDHCI/block component and the catalog's only UFS driver is SM8550-specific, so the first publication driver belongs in the board repository. The proposed minimal graph is Gta4lEmmcBlock (IOBlockStorageDevice, IOResources + IOBSD, guarded by a new XNU_NATIVE_GTA4L_EMMC_BLOCK personality) -> prelinked IOBlockStorageDriver -> whole IOMedia -> IOGUIDPartitionScheme partitions, with the personality added by a board KernelConfigTables patch and the personality flag plumbed through build-xnu-4k-baseline.sh like XNU_NATIVE_RAM_BLOCK. The first rung would split the core into its own archive to avoid duplicate symbols, use a C request-loop helper plus a thin C++ adapter, boot with gta4l-emmc-block=1 (report mode), stay on 1-bit SDR at 400 kHz with per-block CMD17 reads, cap a request at 64 blocks, reject writes and report write protection, mark the media offline on the first read error rather than inventing an unproven reset, and have a bounded kernel thread report the whole media, the GPT partition media and one media-path read-back before panicking. No CMD6, CMD18/CMD12, CMD19, CMD25, user-data write, DMA, CQE, ICE, DDR, HS200/HS400, 8-bit change, mount or root switch is part of the first rung; the storage stack chooses arbitrary read-only LBAs, which is the main scope difference from the pinned probe list and needs explicit owner approval. F5 remains [U] because no IOMedia object has been observed.", "A 2026-11-05 source review corrected the Stage-C/F5 publication design before implementation. The existing storage-ABI qualification pipeline is not runnable as-is in this checkout: refer/IOStorageFamily is missing at the UniXNU root (the gta4l tree has a symlink to the public feed at e45fbe30), the Linux xcrun shim returns the literal macosx instead of a real SDK path, the audit hardcodes build/xnu-prelink/native-apfs-load-positive.macho, and the original candidate plan, the live storage metadata gdb-stop.json, the AES interface audit, build/storage-abi/interface-audit.json and build/ram-block/bindings.json are absent. The live observation is candidate-specific (the audit requires gdb-stop.json:kernel_sha256 == plan.candidate_sha256; the RAM-root gdb-stop.json files are for dc8184da, not the gta4l candidate ca983f7d), and the audit produces the concrete constructor/destructor/metaclass/method bindings, so a compile-only gate is not enough. The gta4l candidate, its plan with the storage extents and original_executable_sha256 852b7846, and the original kernelcache f18b4df8 are present. The qualification paths are (1) rebuild the original storage-audit harness on macOS and run it against the gta4l candidate to produce a gta4l gdb-stop.json, with the audit parameterized for --candidate/--plan, or (2) port the audit and observation harness to the Linux/QEMU setup and produce the gta4l observation there; do not link the driver until one succeeds. The corrected design also advertises kIOMaximumBlockCountReadKey/kIOMaximumByteCountReadKey (64 blocks/32768 bytes/1 segment) so IOBlockStorageDriver splits requests instead of the driver merely rejecting them, sends kIOMessageMediaStateHasChanged(kIOMediaStateOffline) via messageClients outside the controller lock after a read error so the family actually decommissions the media, and narrows F5 to the whole-device IOMedia plus one media-path read matching a same-boot baseline; GPT partition discovery is a separate bounded result, Size is in bytes (61071360*512 = 31268536320), and the report omits UUIDs/serials. No code, build, flash or boot; F5 remains [U].", "A 2026-11-05 Linux/QEMU qualification run cleared the storage-ABI gate for the actual gta4l candidate ca983f7d. The new board harness scripts/audit-gta4l-storage-interface.py drives the parameterized shared audit (UniXNU commit 0a1cc71) and gdb-stop: it stages the existing QEMU ESP with -v serial=3 debug=0x14e keepsym=1 sheng-pmgr=2, stops at _bsd_init (0xfffffff0076e7a3c), and reads the live IOBlockStorageDevice metaclass 0xfffffff006add1d0 and IOService metaclass 0xfffffff007adb5b8 (SCTLR_EL1=0x3454593d, native 4K). The audit reports 190 slots, 176 kernel bindings (162 inherited + 14 pure virtual), vtable 0xfffffff005cb44c0, live instance sizes 0x90/0x88 and the original storage executable unchanged. Artifacts: out/gta4l/storage-abi/gdb-stop.json (218e935e), interface-audit.json (695c7bbe) and provenance.json. The harness accepts --candidate/--plan/--snapshot/--metaclass-object and the Linux tool paths, uses llvm-dwarfdump, preserves the build's -Wno flags, downgrades clang 24's -Wmissing-designated-field-initializers from -Werror, and maps QEMU's current-EL SCTLR to SCTLR_EL1. No driver is linked; block I/O, GPT publication and hardware remain unqualified, and F5 remains [U]. The negative suite scripts/test-gta4l-storage-abi.py covers the positive audit, six mutated-snapshot refusals, the wrong-candidate refusal and the --skip-qemu run-record checks.", "A 2026-11-05 host batch added the portable read-only block request helper package/Gta4lEmmcBlockCore.c/.h. It uses explicit READ/WRITE/INVALID directions, returns per-request completed bytes (including a partial final copy), validates zero, oversized, out-of-range, overflowed and short-buffer requests, rejects writes without touching the callbacks, loops one 512-byte CMD17 read per block through a caller-supplied read_block callback, copies each block through a caller-supplied copy_out callback, caps at 64 blocks/32 KiB, marks the media offline on the first read or copy failure and preserves the first failure record and counters. scripts/test-gta4l-emmc-block.py compiles it against scripts/sim-gta4l-emmc-block/harness.c and passes 23 scenarios plus 18 mutation controls. No IOKit, transport or hardware is involved; the C++ adapter, personality, bindings and device run are still ahead, and F5 remains [U].", "A 2026-11-05 host batch extracted package/Gta4lEmmcPlatform.c/.h (MMIO mapping, width-correct register access, barrier and generic-counter timing) and moved the probe onto it, so package/Gta4lEmmcProbe.c no longer carries window addresses or architectural asm. scripts/build-gta4l-emmc-probe.py now builds libGta4lEmmcCore.a (core, platform and block helper) and libGta4lEmmcProbe.a, records both hashes and rejects duplicate global symbols with nm; configs/gta4l_defconfig force-loads both. Host battery: core 179/104, probe 163/77, block 23/18, and the storage-ABI and board checks pass. The device archives were not built here (no compile record or xcrun); no flash or boot, and F5 remains [U]."]
completion = ["Host: register, clock, link and SMMU facts match the board inventory.", "Reads: SCSI capacity, GPT and known blocks are correct; OS/SystemOS windows stay within userdata.", "Root: the configured volume mounts and launchd starts. Persistence: writes survive reboot within the allocated Data region."]
limits = ["No XNU eMMC driver or XNU block-device result exists yet. Recovery inventory is read-only evidence and does not establish register, clock, DMA, power-domain or SMMU behavior under XNU. Recovery regulator state is not the XNU handoff state; the L24 reading was internally inconsistent (state=disabled with num_users=1 and microvolts=2960000), so it does not prove the eMMC VDD rail is on at the audit point in bsd_init.", "The v5 snapshot and handoff audit are register-level diagnostics. They do not establish the PMIC L24/L11 state, VDDCX power domain, interconnect bandwidth, SMMU stream ID or card protocol state.", "The pinned mainline port is source evidence only. Its no-supply sdhc_1 design does not measure L24/L11 at XNU handoff and is not an XNU regulator control or readback path; the separate SPMI map in docs/pm6125-register-map.md is a register map, not an implemented readback.", "The NativeEmmc audit is static source review only. It does not establish that the reviewed driver builds, probes or reads on any device, and its MediaTek MSDC target does not exercise the gta4l SDHCI v5/CQE/ICE path, clock/reset/power sequencing, interconnect or SMMU. Its firmware-left-controller assumption is not satisfied by the gta4l handoff, and its hardcoded LBA and UUIDs are image-specific."]
next_action = ["The host-local milestone is complete and the mainline RPM/regulator source trace is recorded in docs/rpm-power-interface.md. The pinned port has no L24/L11 consumer and no RPM readback; it relies on retained firmware rails. A separate SPMI readback map is recorded in docs/pm6125-register-map.md. Keep bus power and card clock off and issue no card commands, DMA or storage writes. Do not implement an RPM vote, SPMI regulator write or bus-power acknowledgement to learn the state. Next decision: accept a retained-rail contract only with the written board-level electrical contract and a direct rail measurement; a PMIC readback reports commanded state, not measured voltage, and substitutes for neither; the Mu-Silicium exit trace in docs/firmware-handoff.md shows the handoff writes no LDO control register but does not measure the rails, so it does not unblock the power stage. Keep the working RAM root throughout. Step 4 records the electrical-contract gap assessment in docs/sdhc-electrical-contract.md and Step 6 records NO-GO in docs/sdhc-decision-memo.md; do not treat the passing host-local tests or the oracle as permission for bus-power or card-clock activation. The next legitimate work is host-only evidence acquisition (datasheets, schematic, firmware/RPM analysis) and, only under a separately approved measurement procedure, direct rail/pad measurement. A bounded RPM/XBL static trace is recorded in docs/power-retention-evidence.md §7: it identifies the RPM LDOA resource tables for L11/L24, finds no referenced static table or stored pointer/resolvable PC-relative literal that selects either rail in the bounded scan, and finds no direct L11/L24 voltage, mode or enable write in the traced paths; the setter's class object and per-id array are built at runtime, and the runtime policy, PBS semantics and retention remain unresolved, so E7 stays blocking. The NativeEmmc audit in docs/native-emmc-reference-audit.md is a design reference for the read-only XNU block-device shape. The host-side SDHCI v5/eMMC core is now implemented and host-tested in docs/emmc-driver.md; it performs controller reset, GCC 400 kHz setup, status-enable polling, separate bus/IO power requests that require an observed BUS_ON completion, an explicit fixed-1.8 V signalling and pad-supply policy, CMD3 RCA assignment, normalized SDHCI long responses, 512-byte sector-size enforcement, enumeration, capacity/partition validation and single-block PIO reads only when gta4l-emmc-probe=1 is set. Stages 2 and 3 stop after host init and identification respectively. The stage-2 and stage-3 probes have run on the tablet; the stage-3 failure was audited against the pinned references and the four host-code fixes are applied and host-tested. The host-only CMD2 CRC audit in docs/emmc-cmd2-crc-audit.md ranks the remaining hypotheses and finds no reference-supported software correction; CRC checking stays enabled. The 2026-11-01 cmd1gap candidate completed full stage-3 identification on three units, including the owner's SM-T505N where the fail-closed image had failed CMD2; the 8-us delay is the only source delta and is not proven necessary. The 2026-11-02 stage-1 image completed identification and the read-only block 0/1 CMD17 reads on the owner's SM-T505N and one SM-T505, and the stage-A rebuild then read the full 84-entry primary GPT array (LBAs 2..22), the first usable sector and the last sector on the owner's SM-T505N; every per-LBA sum matched a same-session read-only recovery readback, so the Stage-A/F1 content claim is closed. The 2026-11-02 optional A2/F2 attempt (gta4l-emmc-mb=1) stopped before the multi-block phase at the known CMD3-completion timeout, so no F2 result exists; the post-attempt audit found and fixed a missing SDHCI Multi/Single Block Select bit in the CMD18 transfer-mode word, and a corrected image is required for a second attempt. Bus width (F3), high-speed timing (F4), filesystem/partition verification, block-device publication (F5), DMA, CQE, ICE, write path (F6) and microSD remain absent. The next rung is a B1 diagnostic for the 4-bit readback failure, or a separately planned A2/F2/bus-width variant; any device step needs separate owner approval and a verified EFS/CPEFS backup, and no block-device publication, filesystem mount, DMA, CQE, ICE, write path or microSD path exists. As of 2026-11-02, the attempt-3 drain was exercised on a later boot without resolving F2, and the Stage-B1 bus-width/bus-test rung is host-tested but the 2026-11-02 three-boot hardware run is a failing result: only one boot reached B1 and it stopped at the 4-bit byte-183 readback (sw=0, swrc=-19), so F3 remains unproven. The 2026-11-02 cold session then reproduced the 4-bit stop in 4/4 B1-reaching boots (2 warm, 2 cold), excluded a retained warm-reset card state, and bound all eight boots through a matching p69 re-read; the next rung is the owner-approved B1C continuation (gta4l-emmc-probe=5), planned in section 3.1.3 of the ladder plan but not yet built, and F3 remains unproven pending its device run. The B1C image (gta4l-emmc-probe=5) was built from clean 5ad1dd6, flashed BOOT only to p69 (pre ac356ef1, post c6a9f8e0) and booted seven times without reflashing on 2026-11-03; the same-session p69 re-read after boot 3 matched the post-flash hash. Two warm boots reached the continuation on exactly the pinned 4-bit tuple and both timed out in the CMD19 write phase (tt=1, tw=0, te=0, trc=-11; CC and BufferWriteReady latched, no TC, no error; present 0x03f801f6) - the project's first data-write-direction terminal sample - while the other five stopped pre-B1 (four byte-identical CMD17 TC-only/no-error timeouts and one H8 CMD3 timeout). The timeout repeated across a full cold power cycle and is deterministic conditional on reaching the rung; the hard error skipped the content pass and byte-183 re-read (e183a/esa are placeholders), and es=000009cb still reads at the attempted 4-bit width. F3 remains unproven: neither a width-caused timeout nor an independent first-write property is excluded. The 1-bit discriminator (gta4l-emmc-probe=6) completed its device run: the image was built from clean 5f57dcb (kernel a20d6269, payload fdaa507d, boot image 90cf074c), flashed BOOT-only to p69 (pre c6a9f8e0, post 1ea626f5) and booted thirteen times (seven cold, six warm) without reflashing, both p69 re-reads matched, and two cold boots (1 and 12) reached the rung and timed out in the 1-bit CMD19 write phase with the identical terminal class as the 4-bit continuation (tt=1 tw=0 te=0 trc=-11; CC and BufferWriteReady latched, no TC, no error; present 0x03f801f6; FAIL 1/19/0/0000133a/0000/0011/03f801f6/18) and no CMD6 issued, so the data-write path is broken independent of bus width and the width-caused model is excluded. The other eleven boots stopped pre-B1 (eight H8 CMD3 timeouts, three CMD17 TC-only/no-error timeouts, one at the GPT array LBA 2 - a new position); trc=-20 remains unobserved, the byte-183 paradox is unchanged and F3 stays [U]. The owner-chosen next rung is a host data-timeout audit (probe=7): both hang classes record no data-timeout interrupt despite ERROR_INT_ENABLE carrying the DTO bit, so the rung reads back the timeout/enable state, arms the minimum timeout for a healthy 8-block CMD18+CMD12 read longer than the counter, re-reads block 0 and repeats the 1-bit CMD19 wedge under an 8 s software bound. That host batch is implemented and host-tested (probe 75/46, core 138/83) but not built, flashed or booted; the device run needs a fresh explicit BOOT-only approval. The pre-B1 CMD17/H8 failures and the missing DTO mechanism also need a plan decision before another device step. No block-device publication, mount, root switch, persistent Data path, DMA, CQE, ICE or microSD path exists."]
evidence = [{ kind = "source", reference = "docs/emmc-reference.md", result = "Decodes the recovery eMMC inventory: mmcblk0 at sdhci@4744000, v5/CQE, HS400 Enhanced Strobe, 64-bit ADMA; artifacts under out/gta4l/ram-root-fs-timer-evidence/ (gitignored). Records the KMDX60018M-B425 candidate (32 GB eMMC 5.1 + 24 Gb LPDDR4X, 254FBGA) from a Samsung product brief and a public UFI log, with the exact installed part and electrical limits still unresolved; also credits the Dracen-W/NativeEmmc reference and links its static audit." }, { kind = "source", reference = "docs/build-revisions.md", result = "Records the fs/timer fixture pass and the validated GPT inventory; image sha256 c12e601eceb8e5b5b9cf7a028c0f404653b67dc5ff5577813293673d2dea2b3a." }, { kind = "source", reference = "docs/sdhci-snapshot.md", result = "Records the v5 observation-only snapshot (version, capabilities, vendor power status) and its artifact." }, { kind = "source", reference = "docs/sdhci-handoff-audit.md", result = "Records the read-only GCC and vendor power handoff audit without acknowledging power requests." }, { kind = "source", reference = "docs/sdhci-host-init.md", result = "Records the bounded host-local init probe and its controller-local result." }, { kind = "source", reference = "docs/sdhc-electrical-contract.md", result = "Records the Step 4 board-level electrical-contract assessment for the bus-power-only candidate: nine blocking safety-critical areas (E1–E9) and the evidence-acquisition requirements." }, { kind = "source", reference = "scripts/oracle-gta4l-sdhci-host-init.py", result = "Separate-implementation host oracle (same author) for the controller-local access policy; derives read/write rules from the header and write contract, validates 33 traces, checks prerequisite values, interrupt-suppression confirmation on both initial-value paths, universal stage-local poll bounds, reset-clear ordering, the reset-to-clock observation window, the stable clock poll completion and immediate final confirmation before downstream accesses, the eleven required final stage-4 observations, and post-reset state, rejects ten source mutations plus forty-one synthetic trace controls, and accepts the valid initially-zero interrupt baseline." }, { kind = "source", reference = "docs/sdhc-decision-memo.md", result = "Records the dated Step 6 NO-GO decision, the E1-E9/S1-S4 blocker dispositions and the separated baseline-measurement, controlled-activation and capability-approval gates for sdhc-bus-power-activation." }, { kind = "source", reference = "docs/native-emmc-reference-audit.md", result = "Host-only static audit of Dracen-W/NativeEmmc at 4980f1070b0c822dedb9eb350df710a57df28590: credits Dracen, separates reusable XNU block-device patterns from MediaTek MSDC-specific code, records completion/error-path and license findings, and proposes a host-only test plan without importing code or adding hardware evidence." }, { kind = "source", reference = "docs/sdhc-evidence-gap-checklist.md", result = "Inventories the missing PM6125/eMMC/board documents and links each storage-blocking electrical and procedural gate to its canonical closure criterion; revision 2 separates staged approvals from gate closure, marks roles proposed, adds claim-level source references and the SPMI-arbiter gaps, and prepares the Phase 2 acquisition register; revision 3 completes shared-consumer and parent-supply tracking, separates USID, runtime-APID and descriptor-base evidence, and maps acquisition items to gates; revision 4 aligns the descriptor-base item with the 0x8878 override path and extends measurement tracking to E5-E7; revision 5 records the pinned-image descriptor-base scan; revision 6 corrects its scope after an audit, adds pointer-chain, overlap and pre/post-index controls, and leaves internal indirect/computed and runtime/external writers open; revision 7 strengthens the scan with XZR/SP separation, pointer-slot invalidation, a strict unsupported-instruction stop, and unresolved load/store, revisited-state and truncation reporting; revision 8 keeps conditional-branch paths independent, propagates their invalidation at function return, and stops seeding XZR roots; revision 9 records the exact-build package comparison and the vendor BUS_ON trace; revision 10 narrows those claims after the broad host-only audit (four full and six prefix BL matches, the rpm-smd-regulator backend and path caveats, and 64-bit scanner wrapping with unchanged result sets); revision 11 records the official Samsung CXG1/CWI2 source comparison and the card-detect difference, the non-applicability of the inspected SM-T505 family pages, and the KMDX60018M-B425 candidate with its unresolved datasheet; no gate is closed and NO-GO remains." }, { kind = "source", reference = "docs/porting-approach-reassessment-2026-10-31.md", result = "Records the owner-directed reassessment: software porting proceeds with the Linux/LineageOS/vendor and captured-firmware stack as the reference; the NO-GO is narrowed to the on-device bus-power activation operation, which still requires written owner approval and a verified EFS/CPEFS backup; dependencies to reproduce and residual risks are listed without closing any gate." }, { kind = "source", reference = "docs/archlinux-gta4l-evidence.md", result = "Records the public Arch Linux ARM port for gta4l: U-Boot plus pmOS kernel 7.2, Arch root on eMMC userdata, and project-reported working display, touch, GPU, Wi-Fi, Bluetooth, audio, battery, charging and USB. It is working-stack evidence only; no image was downloaded or run, and it does not establish microSD boot, XNU behavior or electrical state." }, { kind = "source", reference = "docs/emmc-driver.md", result = "Records the native SDHCI v5/eMMC core after the third and stage-3 audit fixes: bus/IO power requests are handled separately, success requires an observed BUS_ON completion and the latest acknowledged IO level to match the desired HOST_CONTROL2 level (a later opposite level, a standalone BUS_ON, contradictory bits or a wrong level raised despite an unchanged VDD_180 bit invalidate an earlier completion; the ack does not clear request latches), a bus-only request is acknowledged with both BUS_SUCCESS and IO_SUCCESS as in Linux, and power-loop exhaustion returns ERR_POWER; the fixed-1.8 V signalling and pad-supply policy is explicit and documented as a departure from the DT-derived Linux state; the probe aborts on a stalled counter; SDHCI long responses are normalized and the response-type mask keeps SHORT_BUSY from being parsed as R2; 4 KiB data sectors and reserved DATA_SECTOR_SIZE encodings are rejected; non-busy command responses and data FIFO drains are followed by a final pre-clear error re-read as well as the CMD7 terminal capture; poll loops use the documented 10 us step, where the microsecond value is a nominal iteration budget rather than a counter deadline, and on the busy-completion success path the CMD7 terminal capture is followed by a final error-status re-read that bounds errors asserted during its diagnostic reads; capacity/partition validation and the staged opt-in XNU probe remain at that point; the single-block CMD17 PIO reads were exercised later on hardware (below). The stage-2 probe ran on the tablet on 2026-10-31 and reported GTA4L-EMMC HOST REPORT rc=0 mci=10000072 pwr=0f clk=0007 hc2=0008 ven=00318a0c pst=00000000 log=4/1/268435570 (photo sha256 d049547e8fd6135aafe6fb8aff13c9e8295cb9e2012b3944cdb66ac364882a2c); BOOT only, readback matched and recovery stayed byte-identical. This establishes controller reset, bus/IO power completion, pad policy and card clock; card identification, sector reads, rail voltages and retention remain unproven, and no block device, filesystem, DMA, CQE, ICE or write path exists. The later stage-3 identification attempt failed with ERR_CMD_CRC; the follow-up audit added the GCC SDCC1 block reset, the vendor POR 0xA9C restore, the PWRSAVE_DLL clear, the low-speed DLL_RST/DLL_PDN pair and terminal-failure capture, a second audit added clock-gated failure diagnostics and retirement of recovered CMD1 timeouts, and the probe now reports the DLL registers and terminal failure record. The later diagnostics-only cmd2window run passes CMD2 and stops at a CMD3 completion timeout (rc=-7); the expanded fmt=2 capture ran on hardware on 2026-10-31 and passed CMD3 and CMD9, then stopped at a CMD7 R1b completion timeout with TC set and CC absent (see docs/emmc-cmd7-timeout-finding.md). The 2026-11-02 stage-1 image completed identification and both read-only CMD17 reads on the owner's SM-T505N and one SM-T505; the reports carry step=15, log=7, the recovery-known CSD, and block 0/block 1 words that decode to a protective MBR and a GPT header. The block 0 fingerprint is identical across units and the block 1 fingerprint differs, consistent with a per-device GPT header. This is single-block content evidence, not a filesystem, reliability, publication or write result." }, { kind = "source", reference = "docs/emmc-cmd2-crc-audit.md", result = "Host-only reference audit of the stage-3 CMD2 CRC failure. Attributes -8 to CMD2 by code-path inference (CMD0 has no response, CMD1 has no CRC), confirms the command encoding, long-response shift, error mapping, 400 kHz RCG and low-speed vendor/DLL policy match mainline Linux and Samsung, and records that Linux writes neither DDR_CONFIG_POR_VAL 0x80040873 nor CORE_CMDIN_RCLK_EN before the first command at 400 kHz; the only vendor omissions (0x21C capabilities, 0x244 power-IRQ mask) do not affect command issue or CRC. Ranks seven hypotheses for the recorded failure and for a failure that persists on current source, with a discriminating diagnostic and explicit non-supported statements for each. The later diagnostics-only cmd2window run is recorded separately in section 2.7 and section 10: CMD2 was accepted and CMD3 ended in a completion-poll timeout. The later fmt=2 run is recorded in section 2.8: CMD2, CMD3 and CMD9 completed and CMD7 ended in a completion timeout with TC set and CC absent; docs/emmc-cmd7-timeout-finding.md holds the focused decode. No reference-supported software correction exists and CRC checking must stay enabled. The 2026-11-02 stage-1 result is recorded in section 2.12: two units completed identification and the read-only block 0/1 CMD17 reads, with block 0 decoding to a protective MBR entry and block 1 to an EFI PART GPT header; the owner's SM-T505N flash/readback is recorded, while the SM-T505 run is owner-supplied without a flash record." }, { kind = "host", reference = "scripts/test-gta4l-emmc.py", command = "python3.11 -B scripts/test-gta4l-emmc.py", revision = "60817c39a927c8614ed02adcb534b73933e5f213", result = "PASS (uncommitted working tree on this base revision): 98 simulator scenarios and 55 mutation controls (SDCC1 block reset, reset pulse and deassert, SDHCI access before clocks, DLL power-down before reset, recovered CMD1 timeout retirement, CMD2 CRC with simultaneous command complete, raw-response snapshot before latch clear, failed AHB/APPS branch enable with no SDHCI access, recovered and exhausted CMD1 timeouts, clock-gate flag set before the clocks are verified, vendor POR and MCLK default, PWRSAVE_DLL, 400 kHz CFG, M and pad values, command data bit, pad-switch and 1.8 V bits, power/card-clock/CMD0 settle times, DLL access width, unaligned reset read, disabled status, raw long-response layout, missing bus-on requirement, bus-only ack without IO_SUCCESS, missing IO-completion requirement, wrong-level IO accepted as completion, first-level-wins sticky level, opposite bits accepted as completion, unchanged-bit level shortcut, exhaustion accepted as success, a missing raw-response snapshot, a retimed CMD1 response snapshot, a missing reinit response-window clear, a removed final terminal-read error sample, an accepted reserved sector-size encoding, removed data/response final error samples and missing 4 KiB sector check); the production core is compiled unmodified against the simulated controller with -std=c11 -Wall -Wextra -Werror." }, { kind = "host", reference = "scripts/test-gta4l-emmc-probe.py", command = "python3.11 -B scripts/test-gta4l-emmc-probe.py", revision = "53753df92e9c85c0ffe366e4dd3fb2a97666d120", result = "PASS (uncommitted working tree on this base revision): 38 probe scenarios and 26 mutation controls. The test copies package/Gta4lEmmcProbe.c, replaces only the generic-counter/barrier instructions and the six MMIO helpers with recording hooks, and links it with minimal kernel-header stubs and simulated SDHCI/GCC windows. The CMD7 scenarios cover the transcribed TC-only timeout, changed and unchanged response windows, CC-then-TC, TC-then-CC, simultaneous completion, CC-only bounded timeout, busy-phase error, late busy error, an error asserted during the terminal diagnostic reads on the busy-completion success path and bounded-trace overflow. Three report-max-width end-to-end runs execute the failure, identification and full-probe success report forms with wide simulated values (a 10-digit capacity, both poll budgets at their limit, 16-hex-digit tick fields, a full four-entry CMD7 trace and its overflow count) and require the report to stay below the 2048-byte panic-text budget; they are execution samples, not a field-wise width bound. Three field-wise report-width scenarios call the production formatters from scripts/sim-gta4l-emmc-probe/report-width-fixture.c with bounded extremes (ten-digit counter, six-digit poll budgets, late CC/TC, late stored trace index, maximum overflow, 16-hex-digit ticks and twenty CMD1 attempts), assert every bounded field, and require the measured length plus margin to fit the buffer; a width-budget control checks the 2047/2048 accept boundary, and two fixture mutations narrow a stored trace index and must fail the corresponding trace assertion. A separate oversized-report control requires the explicit rejection of a 2099-byte message. A disabled probe must not panic or touch either window, while an MMIO-map failure and a conflicting diagnostic argument must panic without touching either window; a stuck AHB or APPS branch must panic with clocks=0 and the GCC state while issuing zero SDHCI accesses; a verified-clock version failure control must report clocks=1 and sample each diagnostic register in the report (MCI version, power, clock, HOST_CONTROL, HOST_CONTROL2, vendor, vendor spec 3, DLL config/status, DDR config and power status), with MCI version read twice in total (init plus report) and the others once. A verified-clock RCG timeout control programs the 400 kHz RCG and must report the formatted cfg=00002017, mnd=00000001/000000fc/000000fb, cmd=00000001 and branch/reset values, while reading the diagnostic-only GCC M/N/D/BCR offsets exactly once each; a clock-stability timeout control keeps the RCG update released and must report cmd=00000000 and clk=0001. A stage-3 CMD2 CRC scenario drives CMD0 and CMD1 to completion, fails CMD2 with a synthetic R2 response, and checks the fail/rsp/cmd1 fields, the exact CMD0/CMD1/CMD2 order and arguments, the report read counts and the exact CMD2 encoding. The CMD3 no-CC and late-CC scenarios run identification far enough to record a real CMD3 poll history and timeout capture, including a completion that arrives only after the poll loop expires; the CMD9 timeout scenario checks that the timeout capture is labelled CMD9 while the poll history remains CMD3's; the successful identification scenario completes through EXT_CSD and checks that the success report carries the CMD2, pre-CMD3, poll-history, counter-frequency and CID fields and invents no timeout capture. Two full-probe failure scenarios fail the first and second CMD17 with a data CRC and a data timeout and check the block-read failure report and command stop. Fourteen mutations (unguarded SDHCI read, removed guard, suppressed GCC report read, suppressed SDHCI report read, suppressed raw R2 snapshot, suppressed final-CMD1 window, suppressed pre-CMD2 window, suppressed CMD2 error, changed capture-format identifier, removed HOST_VERSION sample, suppressed success-report CID, suppressed success-report poll history and suppressed timeout command index), plus six CMD7 mutations (suppressed pre-command validity, poll OR mask, TC validity, CC validity, trace overflow count or terminal response window), are rejected for the expected reported reason. The stage-A additions cover the GPT gate, the 21-sector array content phase, the first-usable and last-sector reads, and four loop mutation controls (duplicate LBA, continued error, block-count off-by-one, wrong last LBA)." }, { kind = "host", reference = "scripts/build-gta4l-diagnostic-payload.py", command = "PATH=<python3.11 shim>:$PATH UNIXNU_TOOLCHAIN=<prefix> python3.11 ./unixnu build kernel -D ../UniXNU-gta4l; python3.11 -B scripts/build-gta4l-diagnostic-payload.py --diagnostic emmc-probe-3 ...; python3.11 -B scripts/package-gta4l-diagnostic.py --expect-diagnostic emmc-probe-3 ...", revision = "f156649599c0b33606958f33944fc3fe1c48af8f", result = "The kernel rebuild and the failure-record stage-3 image complete: probe archive sha256 4becbf695bc0a80eccb3e29f326d0f8e79d1f410c03114952b47ab5a2398ed50 with source/header hashes matching the checkout, kernel.macho be30e9f4f5d88a87da2943a8e1c977d8b5c96151ed78051cdae35782eaed186e, payload.img 5a5133a6615afdf61dbb1a50fa36e200d0fb612aaafda058bb0e04d0e6d91042 and boot image 76745fe7e81ca68025ee428cc96c88f98a392b125ecd18c5cf5d0bbef57c7488 (85,688,320 bytes). The payload contract is 7/7 and the boot-image gate 18/18; the manifest keeps hardware_tested=false. The archive helper step requires python3 >= 3.11; the host python3 is 3.9. The image was then written to BOOT only: the pre-flash BOOT partition was saved and verified (sha256 ef2fb96f0b7e0925c157613953d8fc0cd694019232f13408239e579abf97e936, 100,663,296 bytes), the image bytes read back identical (76745fe7e81ca68025ee428cc96c88f98a392b125ecd18c5cf5d0bbef57c7488), the remainder of BOOT and RECOVERY stayed byte-identical (RECOVERY 14e11370c40fd5b70a3dba1d49283e938001141c9d5f8de6685653e6a793f5ae), and no other partition was written. The hardware run is pending. A further host-only rebuild from the current CMD2 CRC diagnostic source produced probe archive f1fa6d50aa0f7cc05ee46d604a6e938ce21dc85f40bcf99dee4d4f52074b83d6 with source/header hashes matching the checkout, kernel.macho 3a2ffc5ef59932df2414c574d753cdaa6ea058017b808a15159791ed4876a1a2, payload.img 0b8e8cf93f1f872bb9958a9ec7b9d6556c54f14958bb8502fbc1c51ceab7fd60 and boot image 663c98921a5a99c802156be03a3e11d50214c30de42feb0d8eafac3d06e63084 (85,688,320 bytes) under out/gta4l/ram-root-emmc-probe-cmd2crc-evidence/. The payload contract is 7/7 and the boot-image gate 18/18; hardware_tested=false, and the image has not been flashed or booted. The host-only CMD2 CRC audit (docs/emmc-cmd2-crc-audit.md) found no reference-supported software correction; CRC checking stays enabled." }, { kind = "source", reference = "docs/pe-storage-stack-provenance.md", result = "Host-only provenance and storage comparison of the dolbaras PixelExperience Plus 11 gta4l release 2026-10-07: local asset size/MD5/SHA-256, Android 11 boot header v2 board SRPTC24A004, 12 base DTBs and 40 dtbo entries, Bengal base 00 plus QRD overlay 00 yielding the live FDT sdhci@4744000 property set, vendor-lineage 4.19.300 diff counts against Samsung/LineageOS/mainline MMC core, inspected-source CMD7 R1 versus the port's R1B design, clock/reset/supply/pad and CQE support/eligibility facts, unresolved source-to-artifact identity and the SM-T505/SM-T505N distinction. No code imported and no hardware result." }, { kind = "source", reference = "scripts/extract-gta4l-pe-artifact.py", result = "Bounded extractor for docs/pe-storage-stack-provenance.md: parses the Android boot v2 header, the embedded FDT sequence and the DTBO table with explicit size, alignment and block bounds, verifies the pinned release and output hashes with --pinned, and never executes archive content, writes into the archive or reuses an output directory." }, { kind = "host", reference = "scripts/test-gta4l-pe-extract.py", command = "python3.11 -B scripts/test-gta4l-pe-extract.py", revision = "3a7bb61a28d47f0ee44129ef64fefd20099ce6bd", result = "PASS on the working tree: the real release archive is used only from the existing host cache and is never downloaded; synthetic archives cover the success path and the truncation, malformed-header, misalignment, table-overflow, overlapping-entry, gzip, marker, duplicate-member, symlink, traversal and pinned-expectation failures." }, { kind = "source", reference = "docs/linuxforgta4l-org-audit.md", result = "Host-only, revision-pinned comparison of the LinuxForGta4l organization trees: Linux 7.2 at c91d0e94 is byte-identical to limonabisi/linux-gta4l cf5f763f across the six inspected MMC files and sm6115.dtsi, with only sound includes, the SM4250 msm-id entry and a battery node removed in the board DTS; downstream 63b2b11b matches the LineageOS cbd2ed85 sdhci-msm.c, mmc_ops.c and host.c bytes, with small enumerated core.c, mmc.c and sdhci.c deltas; CMD3/CMD7 are R1 in Linux, downstream and U-Boot while the port keeps its R1b CMD7 policy; mainline and U-Boot both write CORE_VENDOR_SPEC POR 0xa9c and downstream writes 0xA1C before setting bit 7, all clearing pad bits 15/16, against the port's explicit fixed-1.8 V pad policy; the downstream-only 8 us post-CMD1 delay is recorded as a capture question. The 69-row retrieval manifest is docs/linuxforgta4l-org-audit-manifest.tsv. No code change, build, boot, flash or device access; the CMD7 missing-CC cause remains unresolved." }, { kind = "source", reference = "docs/emmc-cmd1-gap-candidate.md", result = "Records the 8-us post-ready-CMD1 timing candidate after its 2026-11-01 build, BOOT-only flash and three-unit run: source hashes 874e6878/5dd223f7/932552a2, archive 22e6186f, payload 6b6f5212 (contract 7/7), boot image 8a463dae (gate 18/18), readback and recovery verification, and the owner-supplied IDENT REPORT rc=0 transcriptions. All three units completed identification with CMD7 CC+TC; the owner's unit had failed CMD2 on the fail-closed baseline. It states the timing-sensitive interpretation, the owner-supplied evidence limit, the non-necessity of the delay and the no-general-fix conclusion." }, { kind = "host", reference = "scripts/test-gta4l-emmc.py", command = "python3.11 -B scripts/test-gta4l-emmc.py", revision = "2a3268c7fa68c384470bb0ee87270ac594ec3fec", result = "PASS (working tree at the candidate revision): 98 simulator scenarios and 55 mutation controls, including the delay-present, not-ready, short-delay and delay-removed CMD1-to-CMD2 cases." }]

