paths = ["scripts/check-*", "scripts/probe-*", "scripts/audit-*", "scripts/read-*", "scripts/prepare-*", "scripts/*qemu*", "scripts/test-*diagnostic*", "scripts/test-gta4l-sdccdxe-decode.py", "scripts/test-gta4l-spmidxe-descriptor-base.py", "scripts/data/**", "package/tests/**", "package/*Tests*", "package/*Diagnostic*", "package/*Probe*", "package/Boot*", "package/linux-log/**", "unixnu.lock"]
inputs = ["Build logs for the fresh Format 2 tree; the shared prepare-xnu-source.py fetch path; the TB128FU reference revisions."]
configuration = ["UNIXNU_XNU_TAG=xnu-10063.141.1 and the pinned source revision; GITHUB_TOKEN can be supplied to prepare-xnu-source.py but is not required."]
procedure = ["Run the kernel build with a log; on a fetch failure, preserve the log and retry with the retry-safe prepare-xnu-source.py; compare failures across clean output trees."]
findings = ["prepare-xnu-source.py used four threads with a 30 s TLS timeout and no retry. A GitHub raw fetch timed out during the first Format 2 kernel build, before any XNU compilation. The shared script now retries transient failures with a 60 s timeout and exponential backoff; scripts/test_prepare_xnu_source.py covers the retry and non-retry paths.", "The clean build completed with exit 0. The PMGR kernel.macho hash dc8184da757b5323d2f4fb6c7ac1d588790b3d44d583c6d6fd24897cdbbcfe60, 1006/1006 link objects and XNU_NATIVE_PAN=0 records are in docs/build-revisions.md.", "QEMU TCG reached _bsd_init, _sheng_pmgr_run and _IOKitBSDInit with sheng-pmgr=2 and no AMFI bypass, then timed out at _ml_get_timebase before _vfs_mountroot; the PMGR archive audit and build report are retained.", "scripts/test-gta4l-diagnostic-payload.py checks the diagnostic payload builder with temporary stand-ins (forced size, packed_data_ramdisk=false, the contract failure path and the command line) without building a payload or touching board.toml; scripts/test-gta4l-sdccdxe-decode.py and scripts/test-gta4l-spmidxe-descriptor-base.py pin the firmware handoff and descriptor-base scan results. All are host-only and execute no firmware.", "package/Gta4lEmmcProbe.c is the opt-in probe behind gta4l-emmc-probe=1/2/3; scripts/test-gta4l-emmc-probe.py runs its failure and success reports against simulated MMIO, covering CMD3 no-CC/late-CC, CMD9 timeout, successful identification, the CMD7 R1b cases and the field-wise width bounds for all three report forms, and rejects twenty-one mutation controls. The probe is host-tested; stage 2 completed on the tablet, the first stage-3 run failed at CMD2 with a CRC error, and the later cmd2window image passes CMD2 and stops at a CMD3 completion timeout, and the fmt=2 image passes CMD2/CMD3/CMD9 and stops at a CMD7 R1b completion timeout.", "The offline scripts/audit-gta4l-resolved-inputs.py inventory resolves the OS profile, IPSW identity, feeds and lock, component pins, firmware dependency, boot DTB and kernel inputs from local files only; docs/resolved-inputs.md records the result and its limits."]
completion = ["Each claimed milestone has a reproducible command, a matching source/image revision and an accessible result."]
limits = ["The retry test is a host unit test; the kernel/QEMU result is host-only. The QEMU serial layer has no Apple-compatible UART. The tablet result is a panic-screen report, not a serial log."]
next_action = ["Preserve the QEMU evidence and the tablet panic-screen result; qualify the fs/timer diagnostic separately."]
