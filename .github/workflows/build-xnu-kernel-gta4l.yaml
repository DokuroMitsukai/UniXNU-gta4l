name: build-xnu-kernel-gta4l

# Kernel-only bring-up: 4 KiB XNU from the UniXNU driver, with the gta4l board
# (SM6115, iPad7,1 17.7.11) as the device repository.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
      UNIXNU_DEBUG_LDFILELIST: "1"
      XNU_MAKE_V: "1"

    steps:
      - name: Select Xcode 16
        run: |
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          echo "picked: ${XC:-none}"
          if [ -n "$XC" ]; then
            sudo xcode-select -s "$XC/Contents/Developer"
            echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          fi
          xcodebuild -version
          xcrun --find mig

      - name: Checkout UniXNU driver
        uses: actions/checkout@v4
        with:
          repository: Lux12138/UniXNU
          ref: main
          path: UniXNU
          submodules: recursive
          fetch-depth: 1

      - name: Checkout device repository
        uses: actions/checkout@v4
        with:
          path: device
          fetch-depth: 1

      - name: Configure, fetch and assemble tree
        working-directory: UniXNU
        run: |
          chmod +x unixnu
          ./unixnu defconfig gta4l_defconfig -D "$GITHUB_WORKSPACE/device"
          ./unixnu fetch
          ./unixnu tree

      # prepare-xnu-source.py lists Apple headers with the unauthenticated GitHub API,
      # which is rate limited on shared runner IPs (HTTP 403). Cache the listings here.
      - name: Cache XNU DriverKit header listings
        working-directory: UniXNU
        run: |
          mkdir -p out/gta4l/tree/.cache/sources
          cd out/gta4l/tree/.cache/sources
          gh api "repos/apple-oss-distributions/xnu/contents/iokit/DriverKit?ref=xnu-10063.121.3&per_page=100" > xnu-driverkit-10063.121.3.json
          gh api "repos/apple-oss-distributions/xnu/contents/iokit/DriverKit/crypto?ref=xnu-10063.121.3&per_page=100" > xnu-driverkit-crypto-10063.121.3.json
          gh api "repos/apple-oss-distributions/xnu/contents/EXTERNAL_HEADERS/TrustCache?ref=xnu-8796.101.5&per_page=100" > xnu-trustcache-8796.101.5.json
          wc -c *.json

      - name: Build kernel
        working-directory: UniXNU
        run: ./unixnu build kernel -j"$(sysctl -n hw.ncpu)"

      # The driver writes the build output to out/gta4l/logs.
      - name: Dump driver logs
        if: always()
        working-directory: UniXNU
        run: |
          ls -l out/gta4l/logs || true
          for f in out/gta4l/logs/*.log; do
            echo "===== $f"
            tail -n 200 "$f"
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-gta4l
          path: |
            UniXNU/out/gta4l/kernel/
            UniXNU/out/gta4l/logs/
          if-no-files-found: warn
          retention-days: 14
