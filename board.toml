schema_version = 2

[board]
name = "gta4l"
soc = "SM6115"
soc_source = "sm6115"
os_profile = "ipados-17.7.11-21H461"
description = "Samsung Galaxy Tab A7 10.4 (2020)"
kit = "gta4l"

[components]
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]

[kernel]
defconfig = "gta4l_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm6115.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]
# Full ordered plan: setting this array replaces the architecture profile's
# list, so keep every entry and append the board-specific bridge.
# The opt-in original-PMGR bridge is adapted with credit from
# xVanTuring/UniXNU-tb128fu a9c3863. It publishes the original ApplePMGRNub;
# it does not implement clocks, sleep or reset. The first build links a no-op
# stub, then the next build audits the prelinked kernel and links the bridge.
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:SoftwareAES",
  "build-software-aes-bindings.py",
  "build-mockfs-fixture.py",
  "build-libpthread-kernel.py",
  "build-platform-power.py",
  "build-gta4l-sdhci-snapshot.py",
  "build-gta4l-emmc-probe.py",
]

[device_tree]
source = "device:dts/gta4l.dts"
include_dirs = ["soc:dts"]

[userdata]
first_lba = 0xe74000
last_lba = 0x3a3dfde
lba_bytes = 512
windows = [
    { name = "OS", component = "OS" },
    { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[firmware]
config = "gta4l"
dsc = "Platforms/Samsung/gta4lPkg/gta4l.dsc"
fd = "Build/gta4lPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = ["scripts/check-gta4l.py"]
submodules = [
    "Common/Mu",
    "Common/Mu_OEM_Sample",
    "Silicium-ACPI",
    "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl",
]
packages = [
    "{uefi}",
    "{uefi}/Silicon/Qualcomm",
    "{uefi}/Silicon/Silicium",
    "{uefi}/Platforms/Samsung",
    "{uefi}/Common/Mu",
    "{uefi}/Common/Mu_OEM_Sample",
    "{uefi}/Silicium-ACPI",
    "{tree}/package",
    "{tree}/drivers/DarwinBoot",
    "{edk2}",
]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "gta4l"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "gta4l-research"

[bootimg.image]
base = 0x40000000
kernel_offset = 0x00008000
ramdisk_offset = 0x01000000
tags_offset = 0x00000100
pagesize = 4096

[[bootimg.dtb_node]]
path = "/chosen/framebuffer@5c000000"
props = [
    { name = "reg", type = "x", value = ["0x0", "0x5c000000", "0x0", "0x00927c00"] },
    { name = "width", type = "i", value = 1200 },
    { name = "height", type = "i", value = 2000 },
    { name = "stride", type = "i", value = 4800 },
    { name = "format", type = "s", value = "a8r8g8b8" },
]

[[bootimg.dtb_node]]
path = "/soc/spi@4a80000/himax_ts@0"
props = [{ name = "status", type = "s", value = "disabled" }]

[[bootimg.dtb_node]]
path = "/soc/spi@4a80000/novatek@0"
props = [{ name = "status", type = "s", value = "disabled" }]

[[bootimg.dtb_node]]
path = "/soc/spi@4a80000/focaltech@0"
props = [{ name = "status", type = "s", value = "disabled" }]

[payload]
volume = "GTA4LESP"
size_mib = 192
loader = "firmware"
title = "gta4l first boot: source 4K XNU to console"
dram_size = "0xC0000000"
skip_setup_tool = "scripts/seed-data-skip-setup.py"
panic_screen = true
kernel_args = [
    "serial=3",
    "debug=0x14e",
    "keepsym=1",
    "-v",
    "fb-base=0x5c000000",
    "fb-width=1200",
    "fb-height=2000",
    "fb-stride=4800",
    "panel-rot=270",
]

[payload.adt]
chip_id = "444"
# The live 3 GiB map has no single 3 GiB free run. After the live reserved
# regions and the Mu-Silicium DDR reservations, the largest contiguous free
# run is 0x80000000..0x100000000. DarwinBoot offsets the allocation by the
# kernel's 0x7c000 base offset, so the usable request is 2046 MiB, not the
# full 2048 MiB. See docs/memory-map.md. The ADT's dram-size above remains
# the full 0x40000000..0x100000000 physical span, not this owned window.
owned_memory_size = "0x7fe00000"
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
packed_data_ramdisk = true
unique_chip_id = "required"
